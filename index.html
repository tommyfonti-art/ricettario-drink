<style>
html{color-scheme:light}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.bar .btn{padding:6px 12px;font-size:.88rem}
.bar .st{font-size:.8rem;color:var(--muted)}
.bar .st.on{color:var(--ok)}
body.locked .search,body.locked .tabs{display:none}
.panel{max-width:420px}
.panel h2{font-family:var(--f-display);font-size:1.5rem;margin:0 0 8px}
.panel .form input,.panel .form select{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.form select{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.okmsg{color:var(--ok);margin-top:10px}
/* Layout: un quaderno da bancone. Barra sezioni fissa in alto, elenco a righe raggruppate, scheda ricetta con dosi in monospazio, moltiplicatore, unità ml/oz e modifica a richiesta. */
:root{
  --bg:#F3F1F6; --surface:#FFFFFF; --fg:#1D1A24; --muted:#6A6478; --line:#DDD8E5;
  --accent:#B5301C; --accent-soft:#F6DFDA; --accent-fg:#FFFFFF; --ok:#2C6B57; --tag:#E9E5F0;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16141B; --surface:#1F1C27; --fg:#ECE8F2; --muted:#A39CB3; --line:#332F40;
  --accent:#F0674F; --accent-soft:#3A2420; --accent-fg:#1A0F0D; --ok:#6FCBAE; --tag:#2B2735; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16141B; --surface:#1F1C27; --fg:#ECE8F2; --muted:#A39CB3; --line:#332F40;
  --accent:#F0674F; --accent-soft:#3A2420; --accent-fg:#1A0F0D; --ok:#6FCBAE; --tag:#2B2735; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{padding-block:20px 12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.search{margin-top:14px}
.search input{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.search input:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:12px 10px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs .n{font-family:var(--f-mono);font-size:.72rem;margin-left:5px;color:var(--muted)}
main{padding-top:18px;min-width:0}
h2.grp{font-family:var(--f-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500;margin:26px 0 6px;display:flex;gap:10px;align-items:center}
h2.grp:first-child{margin-top:4px}
h2.grp::after{content:"";flex:1;border-top:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;font:inherit;color:inherit;cursor:pointer;text-decoration:none}
.row:hover .rn{color:var(--accent)}
.row .rn{font-weight:500;flex:1;min-width:0;overflow-wrap:anywhere}
.row .rs{color:var(--muted);font-size:.82rem;font-weight:400}
.chip{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:99px;background:var(--tag);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap;font-weight:400}
.chip.hot{background:var(--accent-soft);color:var(--accent)}
.back{font:inherit;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:6px 14px 6px 10px;cursor:pointer;font-weight:600;font-size:.85rem;margin-bottom:12px}
.back b{font-size:1.15rem;line-height:1;font-weight:500;margin-top:-2px}
.rf{margin-left:auto;font:inherit;font-size:1.3rem;line-height:1;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;padding:0}
.rf.spin{animation:sp .8s linear infinite}.rf.done{color:var(--ok)}.rf.bad{color:var(--accent)}
@keyframes sp{to{transform:rotate(360deg)}}
.lo{font:inherit;font-size:.7rem;background:none;border:0;color:var(--muted);opacity:.55;padding:6px 4px;margin-left:14px;cursor:pointer;text-decoration:underline}
.d h2{font-family:var(--f-display);font-size:1.7rem;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 0}
.ctl .lab{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px;min-width:5.4rem}
.ctl button{font:inherit;font-family:var(--f-mono);font-size:.85rem;padding:5px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ctl input{width:70px;font:inherit;font-family:var(--f-mono);font-size:.85rem;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.ing{list-style:none;margin:16px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.ing li{display:flex;gap:12px;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--line)}
.ing li:last-child{border-bottom:0}
.ing .q{font-family:var(--f-mono);font-size:.88rem;min-width:5.6rem;flex:none;font-variant-numeric:tabular-nums}
.ing .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ing a{color:var(--accent)}
h3{font-family:var(--f-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500;margin:24px 0 6px}
.d p{margin:0 0 10px;max-width:65ch}
.dupg{margin:0 0 12px}.dupt{font-weight:600;font-size:.9rem;margin:8px 0 2px}
.btn[disabled]{opacity:.35}
.issue{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin:0 0 10px}.issue .ih{margin-bottom:4px}.issue .it{font-size:.88rem;color:var(--fg);max-width:65ch}.issue .mrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;padding:6px 0;border-top:1px solid var(--line)}.issue .mrow .btn{padding:4px 10px;font-size:.85rem}.issue .ia{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ctl select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;max-width:100%}
.ctl.one{gap:5px}.ctl.one button{padding:5px 7px}.ctl.one input.tot{width:122px;font-family:inherit;font-size:.82rem}
.note{border-left:3px solid var(--accent);padding:6px 12px;background:var(--accent-soft);border-radius:0 6px 6px 0;max-width:65ch}
ul.pts{margin:0;padding-left:18px;max-width:65ch}
ul.pts li{margin-bottom:6px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
.actions{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.danger.sure{background:var(--accent);color:var(--accent-fg)}
.empty{padding:32px 4px;color:var(--muted);max-width:52ch}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:1.15rem;margin-bottom:4px}
.lezcard{display:block;text-align:left;width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;cursor:pointer;text-decoration:none}
.lezcard:hover{border-color:var(--accent)}
.lezcard strong{font-family:var(--f-display);font-size:1.15rem;display:block;margin-bottom:2px}
.lezcard span{color:var(--muted);font-size:.88rem}
.src{color:var(--muted);font-size:.8rem;margin-top:26px}
.form label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 4px}
.form input,.form textarea{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.form textarea{font-family:var(--f-mono);font-size:.88rem;line-height:1.5;resize:vertical}
.form .hint{color:var(--muted);font-size:.8rem;margin:4px 0 0}
.err{color:var(--accent);margin-top:10px}
@media (prefers-reduced-motion:no-preference){.d,.list{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
#printroot{display:none}
@media print{
html,body{background:#fff!important;color:#000!important}
body>*:not(#printroot){display:none!important}
#printroot{display:block;color:#000;background:#fff;font:10pt/1.35 var(--f-body)}
@page{margin:14mm}
#printroot section{break-after:page}
#printroot section:last-child{break-after:auto}
#printroot h1{font-family:var(--f-display);font-size:20pt;margin:0 0 6mm;padding-bottom:2mm;border-bottom:1.5pt solid #000}
#printroot .pcols{column-count:2;column-gap:10mm}
#printroot article{break-inside:avoid;margin:0 0 5mm}
#printroot h2{font-family:var(--f-display);font-size:11.5pt;margin:0 0 1mm}
#printroot ul{list-style:none;margin:0;padding:0}
#printroot li span{font-family:var(--f-mono);display:inline-block;min-width:17mm}
#printroot p{margin:1.5mm 0 0;font-size:9.5pt}
#printroot .pm{color:#333}
#printroot .pn{font-style:italic;color:#333}
}
</style>

<div class="wrap">

    <div class="search"><input id="q" type="search" placeholder="Cerca ricetta o ingrediente" autocomplete="off" aria-label="Cerca"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>

</div>

<script>
/* niente zoom: blocca il pizzico con due dita (iPhone ignora user-scalable) */
(function(){
  var opt={passive:false};
  ["gesturestart","gesturechange","gestureend"].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
})();
(function(){
  var TABS=[["cocktail","Cocktail"],["analcolico","Cocktail analcolici"],["homemade","Homemade"],["blend","Blend"],["soda","Soda"],["infusione","Liquori e infusi"],["menu","Menu"],["lezioni","Lezioni e corsi"],["libri","Libri"],["appunti","Collaborazioni"],["controllare","Da controllare"],["cocktaileng","Cocktail Engineering"],["calcolatori","Calcolatori"]];
  var CE=[{"id":"ce-1","titolo":"Gin: cos'è, come si produce, categorie","sommario":"Riassunto con parole mie, con tutti i dati tecnici; il testo originale resta dell'autore.","fonte":"Cocktail Engineering, Giovanni Ceccarelli — https://www.cocktailengineering.it/ingredienti/gin/","sezioni":[{"titolo":"Le tre categorie di legge (Regolamento CE 110/2008)","testo":"Gradazione minima per tutte: 37,5% vol. La dicitura \"dry\" si può usare solo se gli zuccheri non superano 0,1 g per litro."},{"titolo":"","punti":["Gin: alcol agricolo aromatizzato con bacche di ginepro. Non serve distillare: bastano alcol, ginepro e acqua (si lascia in infusione, si filtra, si diluisce). Si possono aggiungere altre botaniche, aromi ed estratti. È quello che si chiama \"bathtub gin\" o \"compound gin\" (termini non riconosciuti dalla legge). Può essere colorato.","Gin distillato: si ridistilla alcol e acqua in presenza di ginepro e altre botaniche; il ginepro deve prevalere. Dopo si possono aggiungere altri distillati di botaniche, aromi e sostanze aromatizzanti. Se si aggiungono solo essenze all'alcol senza ridistillare, non è gin distillato.","London Gin (sempre \"dry\"): tutte le botaniche vanno ridistillate insieme; dopo si può aggiungere solo altro alcol agricolo e acqua. Niente zuccheri, niente coloranti, niente aromi aggiunti. \"London\" non indica la zona: si può produrre in tutto il mondo."],"testo":"Opinione dell'autore: il gin distillato può dare i risultati migliori, perché permette di distillare ogni botanica separatamente; il London Gin garantisce una qualità media più alta per la rigidità delle regole."},{"titolo":"Botaniche di base","punti":["Ginepro comune: indispensabile, nota resinosa e pungente.","Semi di coriandolo: note agrumate e fresche.","Radice di angelica e di iris: note terrose e legnose, profondità; bilanciano le note floreali.","Scorze di agrumi: arancia e limone i più usati; anche pompelmo, bergamotto, kaffir.","Mandorla: leggera nota di marzapane.","Cardamomo: speziato-fresco, potente, da usare con moderazione.","Cannella o cassia: speziato-caldo.","Liquirizia (la radice): note legnose e dolci."]},{"titolo":"Come si produce","punti":["Gin generico: macerazione di ginepro e botaniche in alcol e acqua, filtrazione, diluizione fino alla gradazione desiderata (almeno 37,5%).","Gin distillato: si prepara almeno uno spirito base ridistillando alcol e acqua con il ginepro; si aggiungono poi altri distillati o aromi; infine si diluisce.","London Dry: ridistillazione con tutte le botaniche; dopo solo alcol e acqua.","Nella caldaia di solito si carica una miscela al 30–40% vol (a discrezione del distillatore).","Alternativa: infusione dei vapori (cestelli di infusione, \"carter head\"): le spezie non stanno in caldaia ma i vapori alcolici ci passano attraverso prima di ricondensarsi."]},{"titolo":"Altri tipi","punti":["Old Tom Gin: nessuna definizione di legge; di solito più morbido del London Dry, spesso con zucchero aggiunto, a volte con una nota di malto.","Sloe Gin: in realtà un liquore (prugnole in infusione o loro succo nel gin); minimo 25% vol e più di 100 g/L di zuccheri."]},{"titolo":"Diciture in etichetta","punti":["Nomi di stati o città (Italian, Scottish...): indicano la zona di produzione, ma non sono regolamentati.","\"Small batch\": nessun limite di legge sul lotto. \"Premium\": non significa nulla, è solo marketing.","Due London Dry hanno per legge lo stesso processo: \"premium\" non dice nulla sulla qualità."]},{"titolo":"Calorie","punti":["100 ml di gin al 40%: circa 220 kcal; al 45%: circa 250 kcal.","50 ml (dose da cocktail): tra 110 e 125 kcal."]},{"titolo":"Come berlo","testo":"Liscio a temperatura ambiente, per non nascondere le note delicate; bicchiere pulito e un bicchiere d'acqua se se ne assaggiano diversi."},{"titolo":"Classificazione per gusto (non di legge)","testo":"Floreali, agrumati, speziati-freschi, speziati-caldi, mediterranei; tradizionali (Gordon's, Beefeater, Tanqueray: aromi più misurati) o moderni (botaniche insolite, carica aromatica forte)."},{"titolo":"Letture consigliate dall'autore","punti":["\"Anthologin\" di Samuele Ambrosi","\"Il Gin italiano\" di Fulvio Piccinino"]}]},{"id":"ce-2","titolo":"Gin Tonic fatto bene","sommario":"Riassunto con parole mie; il testo originale resta dell'autore.","fonte":"Cocktail Engineering, Giovanni Ceccarelli — https://www.cocktailengineering.it/cocktail-classici/fare-il-gin-tonic-come-un-pro/","sezioni":[{"titolo":"Com'è un buon Gin Tonic","testo":"Non è semplicemente 50 ml di gin più 100 ml di tonica: è il miglior equilibrio possibile tra il gin e la tonica scelti. Deve risultare aromatico, amarognolo, leggermente acidulo, effervescente e ben freddo. Gradazione indicativa: circa 12% vol (gin al 40%, 50 ml di gin, 100 ml di tonica, circa 20 ml di diluizione dal ghiaccio)."},{"titolo":"Il gin","testo":"Non c'è un gin giusto per tutti: si parte dai gusti di chi beve. Contano il profilo (agrumato, floreale, balsamico, mediterraneo, sapido, speziato) e l'intensità aromatica. Con un gin molto intenso o più alcolico se ne usa un po' meno."},{"titolo":"La tonica","testo":"Le toniche sono tutte acqua, zucchero, anidride carbonica e pochi aromi (tra cui il chinino, che dà l'amaro): cambia il tipo di aromi, non la qualità. Si usa quella che piace, senza farsi guidare dalla fascia di prezzo. Consigli: non unire gin e tonica entrambi molto profumati (si rischia un profumo, non un drink); non unire profili troppo simili (gin agrumato con tonica agrumata). Se la tonica desiderata non esiste, si può fare in casa."},{"titolo":"Il ghiaccio","testo":"La migliore è la stecca: raffredda piano, limita la diluizione e fa perdere meno gas. I cubetti vanno bene ma diluiscono più in fretta e sgasano di più (molti clienti li preferiscono perché il drink è più facile da bere). Da evitare: ghiaccio in scaglie, tritato o \"da congelatore\" (pieno di punti dove nascono le bolle: sgasa subito la tonica)."},{"titolo":"Agrumi, spezie, decorazioni","testo":"Il drink non ne ha bisogno: in pochi minuti non rilasciano aroma e le spezie in più fanno sgasare. Una scorza (twist) di limone può aiutare, soprattutto con gin poco freschi. Evitare rametti di rosmarino o timo bruciati (sanno di posacenere) e i \"gin tonic macedonia\". Per aromatizzare davvero, meglio aromatizzare il gin o la tonica prima."},{"titolo":"Bicchiere","testo":"Highball (tumbler alto da 350 ml) oppure balloon, più capiente (oltre 500 ml): in quel caso aumentare la quantità di gin per non sbilanciare, e il prezzo dovrebbe essere un po' più alto."},{"titolo":"Errore più grave","testo":"Versare la tonica lungo il cucchiaio da bar: scenografico, ma la superficie del cucchiaio, a livello microscopico, è piena di punti di nucleazione e la tonica sgasa."},{"titolo":"Ricetta di partenza","punti":["50 ml gin","100 ml acqua tonica","Scorza di agrume (facoltativa)"]},{"titolo":"","testo":"Attrezzatura: tumbler alto da 350 ml, jigger, cucchiaio da bar, pelapatate, paletta per il ghiaccio."},{"titolo":"Preparazione","punti":["Raffreddare il bicchiere (con ghiaccio o dal congelatore); se si usa ghiaccio, scolare l'acqua formata.","Versare il gin, mettere il ghiaccio e colmare con la tonica: il ghiaccio non deve galleggiare. Se galleggia, smettere di versare e aggiungere ghiaccio. Circa 100 ml di tonica.","Mescolare piano dal basso verso l'alto.","Eventuale twist di limone in superficie."]},{"titolo":"Servizio \"perfect serve\"","testo":"Si porta al tavolo il bicchiere con ghiaccio, gin e scorza, e la tonica a parte: versa il cliente. Scelta di marketing del locale."},{"titolo":"Regole in sintesi","testo":"Bicchiere ben freddo; ghiaccio cristallino non da congelatore (tirarlo fuori qualche minuto prima); tonica freddissima; trovare l'equilibrio assaggiando; non versare lungo il cucchiaio; non far galleggiare il ghiaccio; niente frutta e spezie nel bicchiere."}]},{"id":"ce-3","titolo":"Cocktail Martini (Martini secco): un drink concettuale","sommario":"Riassunto con parole mie; il testo originale resta dell'autore.","fonte":"Cocktail Engineering, Giovanni Ceccarelli — https://www.cocktailengineering.it/cocktail-classici/ricetta-dry-martini-cocktail-martini/","sezioni":[{"titolo":"Perché \"concettuale\"","testo":"Il Martini non ha un campo di equilibrio definito: esistono infinite proporzioni tra gin e vermouth, tante quante sono le persone che lo bevono. In un sour invece lo sciroppo sta più o meno tra 10 e 20 ml; fuori da quel campo il drink è sbilanciato. Il Martini è quindi un modo di bere gin e vermouth, e anche uno stato d'animo (come il Mai Tai per le vacanze)."},{"titolo":"Un po' di storia","punti":["Nel 1888 (manuale di Harry Johnson) il Martini aveva sciroppo di gomma, bitter, curaçao, gin Old Tom e vermouth, con gin e vermouth in parti uguali. Il Martinez di Jerry Thomas (1889) è concettualmente lo stesso drink.","Negli anni Trenta (Savoy Cocktail Book) esistono già tre versioni: dry, sweet e medium (perfect). Oggi chiedere un Cocktail Martini significa ricevere il Dry Martini."]},{"titolo":"Ricetta di oggi (punto di partenza)","punti":["50 ml London Dry Gin","10 ml vermouth dry","Olive verdi o scorza di limone"]},{"titolo":"","testo":"Attrezzatura: coppetta da 110 ml, mixing glass, jigger, cucchiaio da bar, strainer, stecchino."},{"titolo":"Preparazione","testo":"Ingredienti e attrezzi ben freddi (gin in congelatore, vermouth in frigo; mixing glass e coppetta raffreddati). Versare, aggiungere ghiaccio, mescolare fino alla diluizione desiderata (assaggiando), filtrare (anche doppio filtro) nella coppetta. Il twist di limone deve essere molto leggero: troppi oli essenziali in superficie coprono il drink."},{"titolo":"Come trovare il proprio equilibrio","punti":["Gin: meglio un classico London Dry; evitare gin troppo profumati o particolari, salvo richiesta.","Vermouth dry: Carpano, Martini, Cinzano 1757 (italiani); Dolin, Noilly Prat (francesi; il Noilly Prat ha una nota ossidata gradevole).","Più secco: meno vermouth (a gocce con un contagocce). Più morbido: meno gin e più vermouth, oppure un gin meno secco.","Piccolo trucco: 4–5 gocce di sciroppo di zucchero (o una goccia di bitter) rendono l'aroma più presente senza dolcificare."]},{"titolo":"Varianti","punti":["Martini \"in and out\": il vermouth serve solo a sporcare il ghiaccio, poi si scola. L'autore preferisce usarne mezzo cucchiaino da bar invece di buttarlo.","Montgomery Martini: 15 parti di gin e 1 di vermouth (60 ml di gin e circa 4 ml di vermouth).","Vodka Martini (\"vodkatini\"): meno aromatico e meno secco; 50–60 ml di vodka e 10 ml di vermouth.","Sweet Martini: 50 ml gin e 15 ml vermouth dolce. Perfect Martini: 50 ml gin, 10 ml vermouth dolce e 10 ml vermouth dry.","Gibson: con cipollina lattofermentata. Dirty Martini: con salamoia di olive."]},{"titolo":"Versione preferita dall'autore","punti":["40 ml London Dry Gin","20 ml Noilly Prat","1–2 gocce di bitter all'arancia","2–3 ml di sciroppo di zucchero"]}]},{"id":"ce-4","titolo":"Come calcolare la gradazione alcolica di un cocktail","sommario":"Riassunto con parole mie. Sul sito c'è anche un calcolatore interattivo (fino a 10 ingredienti), che qui non si può scaricare.","fonte":"Cocktail Engineering, Giovanni Ceccarelli — https://www.cocktailengineering.it/tecniche-e-strumentazione/come-calcolare-il-tenore-alcolico-di-un-cocktail/","sezioni":[{"titolo":"Gradazione (% vol)","testo":"È la percentuale di alcol sul volume del liquido. I \"gradi\" nel linguaggio comune sono la stessa cosa e non c'entrano con la temperatura."},{"titolo":"","punti":["Alcol in una dose = quantità × gradazione / 100. Esempio: 60 ml di rum al 40% = 24 ml di alcol.","Una bottiglia da 700 ml al 40% contiene 280 ml di alcol."]},{"titolo":"Quantità assoluta di alcol","punti":["In millilitri: dose × gradazione / 100. Esempio: 50 ml di gin al 47% = 23,5 ml di alcol.","In grammi: millilitri di alcol × 0,789 (densità dell'alcol). 23,5 ml = circa 18,5 g."]},{"titolo":"","testo":"Esempio: un gin tonic (50 ml gin 40% + 100 ml tonica) fa circa 13% vol, un gin sour (50 ml gin, 30 ml limone, 20 ml sciroppo, 10 ml albume) circa 18% vol, ma entrambi contengono la stessa quantità di alcol: circa 15,8 g."},{"titolo":"Calcolo della gradazione del drink: media ponderata","testo":"Esempio Mai Tai: 30 ml rum 40%, 30 ml rum 40%, 15 ml liquore 40%, 30 ml lime 0%, 20 ml orzata 0%."},{"titolo":"","punti":["Senza diluizione: (30·40 + 30·40 + 15·40) / (30+30+15+30+20) = 24% vol.","Con diluizione di 30 ml (acqua del ghiaccio, 0%): ≈ 19,4% vol. La quantità di alcol resta uguale (circa 23,7 g)."]},{"titolo":"Diluizione","testo":"Dopo shakerata, mescolata o altra tecnica di solito si aggiungono tra 30 e 60 ml di acqua (a volte più). La diluizione secondaria nel bicchiere cambia nel tempo e non si considera; meglio misurare il drink prima e dopo."}]},{"id":"ce-5","titolo":"Come preservare l'effervescenza delle sode","sommario":"Riassunto con parole mie; il testo originale resta dell'autore.","fonte":"Cocktail Engineering, Giovanni Ceccarelli — https://www.cocktailengineering.it/tecniche-e-strumentazione/come-preservare-leffervescenza-delle-sode/","sezioni":[{"titolo":"Perché le bevande sono frizzanti","testo":"C'è anidride carbonica (CO₂) disciolta, che torna gas quando la pressione cala di colpo (apertura del tappo). Può derivare dalla fermentazione (prosecco, champagne) oppure essere aggiunta (acqua tonica)."},{"titolo":"Temperatura","testo":"La CO₂ in acqua si scioglie meglio al freddo (a 20 °C circa 1,45 g per litro). Al contrario di sale e zucchero, più il liquido è freddo più gas trattiene. Conclusione pratica: servire e usare le sode ben fredde, così si perde meno effervescenza anche dentro il drink. Fanno eccezione i vini frizzanti serviti da soli, dove conta la temperatura consigliata per non spegnere gli aromi."},{"titolo":"Versare","testo":"Versare piano, con la bottiglia vicina al bicchiere: urti e brusco calo di pressione fanno uscire molta CO₂."},{"titolo":"Il cucchiaio da bar","testo":"Far scivolare la soda lungo il cucchiaio è solo scenografico e dannoso: la superficie del cucchiaio è piena di punti di nucleazione (dove nascono le bolle) e sgasa molto in fretta; inoltre il cucchiaio è sempre toccato con le mani."}]},{"id":"ce-6","titolo":"Costo delle bevande: cos'è e come si calcola","sommario":"Riassunto con parole mie; il testo originale resta dell'autore.","fonte":"Cocktail Engineering, Bruno Rocco — https://www.cocktailengineering.it/marketing-e-management/beverage-cost-calcolo-controllo/","sezioni":[{"titolo":"Cos'è","testo":"Formula: costo delle materie prime / fatturato bevande × 100. Esempio: 3.000 € di materie prime e 12.000 € incassati = 25%."},{"titolo":"Costo del singolo drink","testo":"Per ogni ingrediente: prezzo di acquisto / millilitri della bottiglia × dose. Calcoli sempre senza IVA. Esempio Negroni (30 ml gin, 30 ml vermouth, 30 ml bitter, decorazione): 0,42 + 0,24 + 0,48 + 0,05 = 1,19 €."},{"titolo":"","punti":["Venduto a 10 €: 11,9%. A 8 €: 14,87%. A 6 €: 19,83%."]},{"titolo":"","testo":"Vanno inclusi anche cannuccia, sottobicchiere, decorazione (12 centesimi su 10.000 drink fanno 1.200 € l'anno)."},{"titolo":"","punti":["Costo teorico: dalle ricette standard. Costo reale: dai consumi misurati con l'inventario. Se coincidono il controllo è buono."]},{"titolo":"Valori di riferimento (indicativi)","punti":["Cocktail bar: 18%–25% (con vino e birra è difficile restare sotto il 25–28%).","Locali ad alti volumi: anche sotto il 18%.","Hotel e fascia alta: fino al 28–30%.","Stabilmente sopra il 30%: quasi certamente c'è un problema strutturale."]},{"titolo":"","testo":"Una percentuale bassa non è automaticamente meglio: conta il margine assoluto per drink (7 € a 15% può rendere meno di 14 € a 25%)."},{"titolo":"Perché sale e cosa fare","punti":["Ricette non standardizzate o dosi eccessive: creare le ricette insieme al personale e spiegare i numeri.","Sprechi e perdite (bottiglie aperte, frutta, preparazioni in eccesso): controllare ogni serata.","Furti e omaggi non autorizzati: inventario regolare, meglio il primo giorno del mese prima del servizio, confrontando consumi e incassi.","Fornitori che cambiano listino (spesso a inizio anno): negoziare, vederli come partner; controllare fattura per fattura.","Promozioni non calcolate (happy hour, drink del mese, amari offerti).","Prezzi di vendita non aggiornati: aumentare solo se necessario; se si deve, meglio cambiare proposta del menu in modo che il cliente non faccia il confronto diretto."]},{"titolo":"Conclusione","testo":"Il beverage cost è un indicatore diagnostico, non dice da solo se il locale guadagna: va letto insieme al costo del personale (vedi il documento sul costo primo)."}]},{"id":"ce-7","titolo":"Costo primo: cos'è e come si calcola","sommario":"Riassunto con parole mie; il testo originale resta dell'autore.","fonte":"Cocktail Engineering, Bruno Rocco — https://www.cocktailengineering.it/marketing-e-management/prime-cost-cocktail-bar/","sezioni":[{"titolo":"Definizione","testo":"Somma del costo delle materie prime e del costo del personale, in percentuale sul fatturato (senza IVA). Costo primo = % costo bevande (o cibo e bevande) + % costo del personale. Esempio: bevande 22% + personale 38% = 60%: su ogni 100 € incassati ne restano 40 per affitto, utenze, manutenzioni, marketing e utile."},{"titolo":"Come si calcola il costo del personale","testo":"% = costo totale del personale / fatturato × 100. Include stipendi netti, contributi a carico dell'azienda, TFR, tredicesime e quattordicesime, buoni pasto: tutto quello che il dipendente costa davvero (chiedere aiuto al consulente del lavoro o al commercialista). Esempio del mese: fatturato bevande 15.000 €, materie prime 3.300 € (22%), personale 5.700 € (38%) = 60%. Va calcolato ogni mese: il costo del personale cambia con turni extra, assenze, stagionalità (esempio dell'autore: febbraio è più pesante perché incassi bassi e organico minimo invariato)."},{"titolo":"Valori di riferimento","punti":["Cocktail bar indipendente: tra 55% e 65%.","Sotto il 55% va bene solo se nasce da efficienza vera (turni organizzati, ricette standard, fornitori negoziati) e non da tagli insostenibili (responsabile che lavora troppe ore, carta impoverita).","Sopra il 65% in modo stabile: probabile pareggio o perdita.","Locali ad alti volumi: anche sotto il 55%.","Hotel e fascia alta: fino al 68–70% senza problemi, perché il prezzo medio è alto."]},{"titolo":"Il fatturato assoluto cambia tutto","testo":"Bar indipendente: 30.000 € al mese, costo primo 62% → restano 11.400 €; con 8.000 € di costi fissi l'utile è 3.400 €. Bar di lusso: 60.000 € al mese, costo primo 68% → restano 19.200 €; con 12.000 € di costi fissi l'utile è 7.200 €, più del doppio con una percentuale peggiore."},{"titolo":"Come usarlo","punti":["Se sale per due mesi di fila è un segnale: capire quale componente si è mossa.","Sale il costo bevande: ricette, sprechi, listini dei fornitori, prezzi non aggiornati.","Sale il costo del personale: bassa stagione, turni extra, nuovi assunti non ancora produttivi.","Salgono entrambi: spesso incassi molto bassi o perdita di controllo su più fronti; capire se è episodico o strutturale.","Presentare alla proprietà il numero completo (es. 61% = 23% bevande + 38% personale, margine 39%) costruisce fiducia."]}]}];
  var LIB=[{"id":"lib-1","titolo":"Bubbles: A Guide to Carbonated Cocktails — Bart Miedeksza e Valentino Girotto","sommario":"Guida ai cocktail gassati: riassunto dettagliato in italiano di tutto il libro (2024), con numeri, esperimenti, procedure e sicurezza. Riassunto con parole mie, il testo originale resta degli autori.","fonte":"Bubbles: A Guide to Carbonated Cocktails, Bart Miedeksza e Valentino Girotto, Crossroads Consulting, prima edizione 2024","sezioni":[{"titolo":"","testo":"Come leggere questo riassunto. Non è la traduzione del libro, ma un riassunto scritto con parole mie. Ho tenuto i concetti, le spiegazioni scientifiche, i numeri, le tabelle principali e le procedure. Non ho riportato i testi originali né le ricette complete. Per gli schemi, le fotografie e le ricette intere serve il libro. Nel libro le pressioni sono in psi (libbre per pollice quadrato). Qui le trovi anche in bar: 1 psi vale circa 0,069 bar. Verso la fine, nelle note, segnalo alcune piccole incongruenze che ho trovato nei numeri del libro."},{"titolo":"IL LIBRO IN BREVE"},{"titolo":"","punti":["Chi scrive. Bart Miedeksza e Valentino Girotto, del bar Crossroads di Londra (aperto nel 2020 in un ex bagno pubblico vittoriano, dal 2023 in un locale più grande a Newington Green). Consulente scientifico: dott. Richard Amaee, dottorato in biochimica a Cambridge. Dal 2024 offrono anche corsi e consulenze.","L’idea. Invece di finire il drink con acqua gassata, si prepara il cocktail intero già diluito e lo si carbonata con CO2 da bombola, in bottiglia o in fusto. Così si controllano sapore, grandezza delle bolle, temperatura, velocità di servizio e costanza nel tempo. Il libro è il diario dei loro esperimenti.","Il metodo. Non esiste un valore magico di pressione. Il libro spiega le leggi fisiche, dà esperimenti che si possono rifare con una bilancia e un manometro, e invita a provare, assaggiare e correggere.","Prefazione. Morgenthaler racconta i suoi primi tentativi con la birra allo zenzero fatta col lievito, finiti con bottiglie di vetro esplose in cucina. Ricorda che la gassatura forzata esiste da sempre nel bar: Priestley sciolse gas in acqua nel 1772, nel 1813 Charles Plinth portò per Londra una macchina per acqua gassata e il cameriere John Collins la usò nel suo punch al gin, da cui il Tom Collins."]},{"titolo":"PARTE 1 — COME COMINCIA TUTTO"},{"titolo":"1.1 Principi di base"},{"titolo":"","testo":"Quando apri una lattina o versi dal fusto rompi un equilibrio: il gas disciolto nel liquido non vuole più restare sciolto e cerca di uscire, sotto forma di bolle. Il principio che lo governa è la legge di Henry: la quantità di gas disciolto in un liquido è proporzionale alla pressione parziale di quel gas sopra il liquido (la costante di proporzionalità cambia con la temperatura e con il liquido, e nei cocktail non si comporta mai in modo perfettamente lineare)."},{"titolo":"","testo":"I cinque pilastri della carbonatazione sono: pressione, temperatura, tempo e spazio, acidità, zuccheri. A questi si aggiungono due fattori che decidono come si comporterà il drink dopo: la gradazione alcolica e i sedimenti/impurità. Il messaggio ripetuto in tutto il libro è che tutto è collegato e che serve equilibrio: spingere un solo fattore non basta."},{"titolo":"1.2 Pressione"},{"titolo":"","punti":["Pressione parziale e aria. La legge di Dalton dice che la pressione totale è la somma delle pressioni dei singoli gas. Se nel recipiente c’è aria, la parte di pressione dovuta alla CO2 è più bassa e si scioglie meno gas. Per questo l’aria è considerata un nemico.","Spazio di testa. Più spazio vuoto sopra il liquido, più gas ci sta e più alta è la pressione. Ma non si riempie il recipiente a metà: si segue la regola ¾ – ¼ (tre quarti di liquido, un quarto vuoto). Troppo vuoto spreca CO2 e rischia di dare un drink gassato in eccesso. Oltre il punto di saturazione (che dipende dalla temperatura) non si scioglie altro gas.","Limiti di sicurezza. Un fusto Cornelius regge circa 130 psi (9 bar); una bottiglia di PET circa 150 psi (10,3 bar). Non ci si deve mai avvicinare. Per questo serve sempre un regolatore: la maggior parte non supera 70 psi (4,8 bar), più che sufficienti per qualunque uso.","Sovrasaturazione. Il drink gassato contiene più gas di quanto ne terrebbe a pressione normale: lo si scioglie ad alta pressione e, una volta aperto, resta sovrasaturo finché il gas non esce.","Conservazione. Se il tappo o la guarnizione perdono, il gas esce e il liquido perde frizzantezza. Anche un calo di 1 psi sposta l’equilibrio. Per questo il fusto è preferito alla bottiglia: non lo si apre a ogni servizio e la pressione resta costante fino all’ultimo bicchiere.","Pressione e dimensione delle bolle. Più pressione = bolle più numerose e più piccole (sensazione più morbida). Meno pressione = bolle meno numerose e più grandi."]},{"titolo":"Come si misura il gas disciolto"},{"titolo":"","testo":"Si usano i grammi di gas per litro (g/l), perché si misurano con una semplice bilancia di precisione. Molti testi usano invece i “volumi”: 1 volume significa 1 litro di gas in 1 litro di liquido, cioè circa 2 g/l (1,96). Una bibita gassata comune ha 3-4 volumi, quindi circa 6-8 g/l. I cocktail di Crossroads stanno intorno a 5-6,5 g/l."},{"titolo":"","testo":"Metodo con la bilancia: pesa la bottiglia con il liquido, senza tappo, prima di gassare. Dopo la gassatura pesala di nuovo senza tappo (il tappo conterrebbe anche il gas libero nello spazio di testa). La differenza è il gas disciolto. Va fatto subito, perché appena si apre il gas comincia a uscire."},{"titolo":"A quale pressione gassare?"},{"titolo":"","testo":"Non c’è una risposta unica: servono la legge di Henry e la legge dei gas perfetti, e per i cocktail non esistono costanti già pronte (solo per l’acqua). La relazione di base è: quantità di gas disciolto = costante di Henry × pressione, quindi per ottenere una certa quantità serve una pressione pari alla quantità desiderata divisa per la costante, alla temperatura del liquido."},{"titolo":"","punti":["Punto di partenza usato da Crossroads: bottiglie PET 40-45 psi (2,8-3,1 bar); fusti Cornelius 45-61 psi (3,1-4,2 bar), a seconda del drink.","Conta la pressione dentro il recipiente, non quella impostata sul regolatore: si legge con un manometro. Con il regolatore a 50 psi la pressione interna non è 50 psi.","La dimensione del recipiente non cambia la pressione necessaria, cambia il tempo: un fusto da 100 litri a 45 psi ci mette circa una settimana invece di un giorno.","Il fusto richiede un po’ di più perché il liquido percorre una linea prima del rubinetto e perde gas lungo il tragitto. Regola pratica: partire con circa 10% in più (più lunga la linea, più si perde: 10 m contro 2 m), poi correggere per tentativi."]},{"titolo":"Esperimento 1 — Effetto dello spazio di testa"},{"titolo":"","tabella":[["Recipiente","Poca acqua (più spazio vuoto)","Molta acqua (meno spazio vuoto)"],["Fusto da 2 l, acqua a 20 °C, 60 psi per 1 minuto con agitazione","500 g → pressione interna 56 psi","1.500 g → 52 psi"],["Bottiglia da 500 ml, stesse condizioni","300 g → 57 psi","500 g → 53 psi"]]},{"titolo":"","testo":"Conclusione: più spazio di testa, più pressione parziale, più gas disciolto."},{"titolo":"1.3 Temperatura"},{"titolo":"","testo":"La solubilità del gas dipende dalla temperatura: più freddo, più gas si scioglie e più a lungo resta. Valori per l’acqua a pressione atmosferica:"},{"titolo":"","tabella":[["Temperatura","0 °C","10 °C","20 °C","25 °C","30 °C","40 °C"],["Gas disciolto (g/l)","3,34","2,31","1,68","1,44","1,25","0,97"]]},{"titolo":"","punti":["Perché. Con il caldo le molecole si muovono più velocemente, si urtano di più e il gas scappa più facilmente. Aumentano anche il degassamento e la schiuma. Il liquido “ricorda” ogni aumento di temperatura: il gas uscito non rientra senza una nuova pressione.","Obiettivo. Tenere tutto il più freddo possibile, vicino a 0 °C o sotto, compatibilmente col punto di congelamento del miscuglio (zuccheri, acidi, sali e alcol lo abbassano).","PET. Freezer, frigo o bagno di acqua e ghiaccio, dando tempo alla bottiglia di raffreddarsi bene. Poi mantenere il freddo fino al servizio.","Fusti. Sostituire parte dell’acqua di diluizione con ghiaccio tritato (pesato, non misurato a volume, perché il ghiaccio occupa più spazio) e agitare. I fusti sono isolati come un termos: metterli in frigo senza raffreddare prima il contenuto richiede moltissimo tempo. Prima si raffredda con il ghiaccio, dopo la gassatura il fusto va in frigo.","Ingredienti. Meglio raffreddarli la sera prima. Lungo la linea di erogazione serve un refrigeratore di flusso.","La CO2 stessa si raffredda quando si espande entrando nel recipiente, e dà un piccolo aiuto.","Bicchieri. Un bicchiere caldo rovina il lavoro. Il migliore è un bicchiere congelato (circa −10 °C). In alternativa ghiaccio e acqua fredda, che però raggiunge temperature meno basse e lascia un po’ di acqua piatta nel bicchiere.","Con il grafico di pressione e temperatura (fornito da Krones) si stima che per sciogliere 7 g/l di CO2 in acqua serva una pressione di equilibrio di circa 30 psi (2,1 bar). Vale per l’acqua: altri ingredienti cambiano il risultato."]},{"titolo":"Esperimento 2 — Effetto della temperatura"},{"titolo":"","testo":"Stessa acqua, 60 psi per 30 secondi con forte agitazione, bottiglia pesata senza tappo prima e dopo."},{"titolo":"","tabella":[["Temperatura","Peso preso","Gas disciolto (circa)"],["5 °C","+2,65 g","7,1 g/l"],["10 °C","+2,26 g","6 g/l"],["30 °C","+0,44 g","1,1 g/l"]]},{"titolo":"1.4 Tempo e spazio"},{"titolo":"","punti":["Più a lungo il liquido resta a contatto con il gas sotto pressione, più gas si scioglie. La fretta spreca gas. Con le bottiglie, aspettare che il liquido torni limpido, senza bollicine né torbidità.","Rendimenti decrescenti. Man mano che il liquido si riempie, il gas già disciolto “spinge indietro” (principio di Le Chatelier). Circa l’80% dell’effetto avviene nel primo 20% del tempo. Conviene assaggiare di tanto in tanto e staccare il gas quando si è raggiunto il livello voluto.","Tempi di Crossroads: circa 20-30 minuti per le bottiglie PET; circa 24 ore in tutto per i fusti Cornelius.","Superficie di contatto. Più è grande, più in fretta si raggiunge l’equilibrio. Si ottiene agitando (nelle bottiglie senza timore: agitare non fa perdere gas in questa fase) e iniettando il gas direttamente nel liquido (bottiglia capovolta, oppure pietre porose).","Fusti. Non sollevarli per agitarli (schiena): si coricano e si fanno rotolare con il piede. Si può iniettare dal raccordo di uscita (il tubo pescante diventa una sonda) oppure con una pietra porosa. Un fusto coricato offre più superficie; in quella posizione l’ugello di iniezione va ruotato verso il basso, a contatto con il liquido."]},{"titolo":"1.5 Acidità"},{"titolo":"","punti":["Quando la CO2 si scioglie in acqua forma acido carbonico (idratazione, favorita dagli ioni idrogeno). In presenza di più acidità l’equilibrio si sposta verso l’acido carbonico e si scioglie più gas. L’acido carbonico domina a pH basso, il bicarbonato a pH neutro, il carbonato a pH alto. Non bisogna esagerare: un cocktail troppo acido non sarà più gassato, solo sgradevole.","Alcol. Nell’etanolo puro la CO2 si scioglie senza reazione chimica e il pH conta poco. Ma un liquore a 40% contiene il 60% di acqua, dove la reazione avviene.","Curiosità. Sciogliere gas libera un po’ di calore (processo esotermico), meno di un grado: per questo, aggiungendo calore, il gas esce.","Niente agrumi freschi. Succo di limone o lime non chiarificati portano sedimenti e il drink degassa. Meglio acidi in soluzione, aceti o ingredienti acidi naturali. Crossroads ha un menu senza agrumi, per ridurre sprechi e bisogno di chiarificare.","Supasawa. Miscela acida belga (acidi citrico, malico, fosforico, tartarico, succinico e benzoato di sodio), pH 1,95, dura un anno dopo l’apertura. È presente in almeno un cocktail del menu fin dall’apertura.","Effetto conservante. Il pH più basso, la pressione, il freddo, l’assenza di ossigeno e l’eventuale alcol ostacolano i microbi: nel fusto i cocktail restano stabili per mesi."]},{"titolo":"Gli acidi usati nelle bevande (pH di una soluzione 0,1 M)"},{"titolo":"","tabella":[["Acido","pH 0,1 M","Note principali"],["Citrico","circa 2,2","Il più usato nei gusti di frutta. Massa molare 192,12 g/mol."],["Malico","2,2-2,3","Un po’ più forte del citrico, sapore più pieno e rotondo, ottimo in miscela con il citrico. 134,10 g/mol."],["Acetico","circa 2,4","Sapore di aceto. Può spostare l’acido carbonico dai carbonati: sconsigliato per gassare."],["Ascorbico (vitamina C)","circa 2,3","Antiossidante e stabilizzante, ma si ossida facilmente."],["Fumarico","circa 2,1","Vietato nelle bibite in UE e UK, ammesso negli Stati Uniti. Si scioglie lentamente."],["Lattico","2,4-2,5","Mite, più esaltatore di sapore che acido."],["Fosforico","circa 1,5","Tipico della cola, secco e tagliente. Corrosivo."],["Tartarico","circa 2,0","Più aspro del citrico, richiama uva e mirtillo rosso."]]},{"titolo":"","testo":"Quantità di ogni acido (g/l) per ottenere la stessa acidità percepita, secondo prove di laboratorio del 1990: fosforico 0,85; acetico 1,00; tartarico 1,00; fumarico 1,08; malico 1,12; citrico 1,22; lattico 1,36; ascorbico 3,00. Meno ne serve, più è forte."},{"titolo":"","testo":"Nota sulle unità. Una soluzione 0,1 M contiene 0,1 mole di sostanza per litro: si ottiene moltiplicando 0,1 per la massa molare (per il citrico, 0,1 × 192,12 = 19,212 g in un litro totale)."},{"titolo":"Esperimento 3 — Acidità"},{"titolo":"","testo":"Acqua a 5 °C, 60 psi per 30 secondi con agitazione. Acqua semplice: +2,13 g (circa 7,1 g/l). Acqua con 1% di acido citrico: +2,53 g (circa 8,3 g/l). L’acidità aumenta quindi il gas disciolto (vedi nota sui numeri a fine documento)."},{"titolo":"1.6 Zuccheri"},{"titolo":"","punti":["Gli zuccheri si sciolgono senza cambiare chimicamente, ma occupano posto nel liquido, in competizione con la CO2: più zucchero, meno gas disciolto; meno zucchero, più gas.","Zuccheri e solidi disciolti aumentano densità, viscosità e tensione superficiale: bolle più piccole e lente, meno sensazione di freschezza frizzante, ma bolle che durano di più in superficie. Lo zucchero può anche fare da punto di partenza per nuove bolle e quindi accelerare il degassamento.","L’equilibrio vero è il gusto: un cocktail meno dolce gassa meglio, ma deve comunque essere buono."]},{"titolo":"Dolcificanti: dal più denso al meno denso (a pari grado Brix)"},{"titolo":"","tabella":[["#","Dolcificante","Composizione e sapore (sintesi)"],["1","Miele","Fruttosio 30-44%, glucosio 25-40%, acqua 17-20%. Sapori da floreale a legnoso, speziato, caramellato."],["2","Sciroppo d’agave","Fruttosio 55-90%. Caramello con note terrose e vanigliate. Meno denso del miele ma molto sciropposo."],["3","Sciroppo d’acero","Soprattutto saccarosio (60-70%). Legnoso, di nocciola, a volte affumicato."],["4","Zucchero di cocco","Saccarosio 70-80%. Terroso, floreale, di nocciola."],["5","Zucchero di palma","Simile al cocco. Burro-caramello e melassa, leggero acidulo."],["6","Zucchero di canna scuro","Saccarosio 85-95% più melassa. Toffee, burro-caramello."],["7","Zucchero semolato","Saccarosio quasi puro, sapore neutro, si scioglie facilmente."],["8","Frutto del monaco","Dolcificante non calorico (mogrosidi, 200-300 volte più dolce del saccarosio). Quasi neutro, con lievi note fruttate."]]},{"titolo":"","testo":"Dolcificanti artificiali (aspartame, saccarina, acesulfame, sucralosio, stevia): danno molta dolcezza con pochissimo effetto su densità e viscosità (il sucralosio è circa 600 volte più dolce del saccarosio). Per questo le grandi aziende li amano nelle bibite gassate. Gli autori non li consigliano, per la qualità del gusto."},{"titolo":"Esperimento 4 — Zucchero"},{"titolo":"","testo":"Acqua a 10 °C, 60 psi per 30 secondi con agitazione. Solo acqua: +1,71 g (circa 5,6 g/l). Acqua con 100 ml di sciroppo 1:1: +0,60 g (circa 2 g/l). Lo zucchero ha tolto più di metà del gas disciolto."},{"titolo":"PARTE 2 — COME SI COMPORTANO LE BOLLE"},{"titolo":"2.1 Gradazione alcolica"},{"titolo":"","punti":["Perché l’alcol scioglie più gas. L’etanolo è meno polare dell’acqua, forma legami a idrogeno più deboli e ha una parte non polare nella molecola: la CO2 (non polare) vi si accomoda meglio. La costante di Henry dell’etanolo è circa un ordine di grandezza più alta di quella dell’acqua.","Perché comunque non conviene un drink molto alcolico: degassamento rapido, equilibrio di sapore, sicurezza, schiuma, e la sensazione di freschezza che si vuole dal primo sorso viene contrastata.","Ubriacarsi più in fretta. Il gas favorisce lo svuotamento dello stomaco verso l’intestino, dove l’alcol viene assorbito più rapidamente. Non ci si ubriaca di più, ma prima: un problema di sicurezza e di attività del locale.","Schiuma. L’etanolo ha tensione superficiale bassa (il gas esce facilmente) e viscosità un po’ maggiore (le bolle durano in superficie): molto gas che vuole uscire e fatica a farlo. Da solo la schiuma sparisce subito, ma insieme a zuccheri, aria e sedimenti diventa più densa e duratura."]},{"titolo":"Esperimento 5 — Acqua contro vodka al 40%"},{"titolo":"","testo":"Entrambe a 5 °C, gassate allo stesso modo, aperte a temperatura ambiente e pesate per 20 minuti. Perdita di gas: vodka −1,03 g, acqua −0,73 g. La vodka ha perso gas più in fretta, soprattutto nei primi tre minuti, poi ha seguito una curva simile all’acqua. L’alcol tiene più gas ma lo lascia andare più velocemente e schiuma di più."},{"titolo":"2.2 Proprietà dei liquidi"},{"titolo":"","tabella":[["Proprietà","Ordine (dal più alto)","Effetti sulle bolle"],["Tensione superficiale","soluzione zuccherina > acqua > etanolo","Alta: bolle più piccole e stabili, degassamento più lento. Bassa: bolle più grandi, più schiuma facile."],["Viscosità","soluzione zuccherina > etanolo > acqua (differenza tra etanolo e acqua minima)","Alta: bolle più piccole e meno unite tra loro, salita più lenta, forme meno sferiche."],["Densità","soluzione zuccherina > acqua > etanolo","Alta: bolle più piccole, meno sensazione di frizzante; la spinta verso l’alto cambia."]]},{"titolo":"","punti":["Acqua: bolle stabili, buona sensazione frizzante, degassamento medio, poca schiuma.","Etanolo: schiuma facile, bolle un po’ più grandi, all’inizio più frizzantezza ma drink che diventa piatto prima; ingrediente instabile da gassare.","Soluzione zuccherina: degassamento lento, frizzantezza sul palato molto minore, bolle piccolissime: il gas c’è e dura, ma non dà la sensazione cercata."]},{"titolo":"2.3 Impurità"},{"titolo":"","punti":["Nucleazione. Le bolle nascono su punti precisi: graffi del bicchiere, sedimenti, residui di lavastoviglie o di panni, e anche sulle altre bolle. Più punti, più bolle nel bicchiere e drink che si sgasa prima. L’ideale è che le bolle nascano sulla lingua, non nel bicchiere.","Chiarificare è il modo più efficace per ridurre i punti di nucleazione: Pectinex, agar, gelatina, filtro da caffè, congelamento, filtrazione con carbone, centrifuga. La chiarificazione col latte è sconsigliata (residui di proteine). Si può anche rendere idrofobo il vetro, ma la lavastoviglie toglie il trattamento. Eliminare tutti i punti è solo teoria.","Ghiaccio. I cubetti hanno molti spigoli e superficie. Meglio un blocco o una colonna: meno nucleazione, fonde più lentamente, meno diluizione. Senza ghiaccio il drink si scalderebbe e perderebbe gas, quindi il ghiaccio resta utile.","Aria. Va eliminata: spremere la bottiglia PET fino a far arrivare il liquido all’orlo; scaricare la bottiglia 2-3 volte; sfiatare il fusto 2-3 volte durante la gassatura. Lo sfiato porta via anche gas indesiderati disciolti (ossigeno e azoto), riduce la schiuma e protegge dall’ossidazione."]},{"titolo":"Esperimento 6 — Aria nel recipiente"},{"titolo":"","tabella":[["Prova","Prima dello sfiato","Dopo lo sfiato"],["Fusto da 2 l, 960 g di acqua a 20 °C, 60 psi per 1 minuto con agitazione, tre sfiati","56 psi interni","60 psi interni"],["Bottiglia da 500 ml, 300 g di acqua, un ciclo di scarico (aria già spremuta fuori)","52 psi","53,5-54 psi"]]},{"titolo":"L’acqua come ingrediente"},{"titolo":"","testo":"L’acqua di diluizione influisce su sapore e gassatura. Quella buona per gassare è priva di impurità, con pH neutro e minerali equilibrati."},{"titolo":"","punti":["Cloro e cloramine: riducono il gas che si può sciogliere, accelerano il degassamento, danno sapore chimico.","Composti organici (pesticidi, erbicidi): possibili punti di nucleazione, alterano gusto e solubilità.","Metalli pesanti (piombo, rame, mercurio): possono reagire con la CO2, fare da punti di nucleazione, e sono un rischio per la salute.","Sedimenti: nucleazione, intasano l’attrezzatura, rovinano limpidezza e gusto.","Durezza. L’acqua dura (calcio, magnesio) forma carbonati poco solubili e punti di nucleazione; l’acqua dolce è meglio. L’acqua del rubinetto di Londra, dicono, non è ideale senza filtro.","Consigli: filtrare, usare acqua dolce o addolcita, tenere pulita l’attrezzatura per evitare incrostazioni."]},{"titolo":"Pectina e Pectinex"},{"titolo":"","punti":["La pectina (nelle pareti cellulari di molta frutta e verdura) non fa schiuma, ma stabilizza quella che c’è: aumenta la viscosità, forma una pellicola attorno alle bolle e trattiene acqua nella schiuma.","Il Pectinex è una preparazione di enzimi (pectinasi) che demolisce la pectina: rende più chiaro e filtrabile il succo e ne aumenta la resa.","Temperatura: lavora meglio a 40-50 °C, perde efficacia sopra 60 °C, è inattivo sopra 80 °C.","Dose di partenza: tra 0,1% e 0,5% del peso, controllando l’etichetta. Procedura: aggiungere, tenere alla temperatura giusta per alcune ore, poi filtrare."]},{"titolo":"Proteine"},{"titolo":"","testo":"Proteine e gassatura vanno male insieme. L’acido carbonico e gli altri cambiamenti fanno perdere alle proteine la loro forma (denaturazione). Esse si dispongono sulla superficie delle bolle e formano una pellicola resistente che crea schiuma densa e duratura, come l’albume sopra un sour. Fanno anche da punti di nucleazione. Quindi si evitano, soprattutto le proteine del latte."},{"titolo":"2.4 Troppo gas (sovracarbonatazione)"},{"titolo":"","testo":"I cinque segni:"},{"titolo":"","punti":["Frizzantezza eccessiva e aggressiva, con bolle finissime.","Perdita rapida del gas: il drink diventa piatto in fretta, perché la pressione interna era troppo alta.","Sapore sgradevole: sensazione pungente, amarezza più marcata.","Troppa schiuma all’apertura o al rubinetto (può avere anche altre cause: temperatura, alcol, impurità).","Pressione elevata nel contenitore chiuso: rischio di scoppio all’apertura, soprattutto nelle PET. Usare bottiglie nate per bibite gassate, non per acqua naturale."]},{"titolo":"","testo":"Il fusto è più sicuro: è più difficile sovracarbonare e, se succede, si può sfiatare qualche volta per ridurre la pressione e riequilibrare. Si previene controllando pressione di iniezione, temperatura e durata. Una tabella di carbonatazione serve come guida, non come regola."},{"titolo":"2.5 Come ridurre la schiuma"},{"titolo":"","punti":["Temperatura bassa in tutto il processo, dal lotto al servizio.","Zucchero: più ce n’è, più schiuma stabile (tensione superficiale).","Proteine: evitarle del tutto.","Alcol: meno ce n’è, meno schiuma. Non obbligatoriamente analcolico, ma una gradazione bassa aiuta.","Sfiato del fusto / scarico della bottiglia 2-3 volte: una delle tecniche più efficaci, perché elimina i gas indesiderati.","Antischiuma (glicole polietilenico, PEG): riduce la tensione superficiale e quindi la schiuma, ma accorcia la durata della frizzantezza.","Spruzzo di alcol sulla schiuma: a pressione normale l’etanolo scioglie la schiuma (come la vodka sull’Espresso Martini). Dà anche un livello aromatico in più.","Oli di agrumi (limonene, citrale): riducono la tensione superficiale, ma cambiano il sapore.","Tannini (tè nero e oolong ne hanno molti): stabilizzano la schiuma. Si riducono lavando le foglie con acqua fredda o con un’infusione molto breve (1-2 minuti).","Pectina: demolirla con le pectinasi."]},{"titolo":"2.6 Effetto del bicchiere"},{"titolo":"","punti":["Il gas esce in due modi: dalle bolle e direttamente dalla superficie del liquido.","Forma e dimensione. Un bicchiere largo ha più superficie e degassa prima: per questo le flûte da champagne sono strette. Una coppa, con superfici quasi orizzontali dove si depositano impurità, ha più punti di nucleazione di un tumbler dritto. Anche una gocciolina d’acqua congelata, un granello, o il marchio inciso possono innescare bolle.","Volume. Un bicchiere pieno fino all’orlo mantiene la frizzantezza più a lungo (più gas a parità di superficie).","Altezza. Nei bicchieri alti le bolle diventano più grandi, perché durante la salita attirano altro gas. Nei bicchieri bassi lo stesso drink può avere un gusto più pungente (più acido carbonico resta in soluzione)."]},{"titolo":"PARTE 3 — NEL BICCHIERE"},{"titolo":"3.1 Forma delle bolle"},{"titolo":"","testo":"Le bolle sono sfere perché la sfera è la forma con la minima superficie a parità di volume e richiede meno energia: forze interne ed esterne si bilanciano da ogni lato e la tensione superficiale le tiene insieme."},{"titolo":"3.2 Texture, la sensazione in bocca"},{"titolo":"","punti":["Come sentiamo il gas. Un enzima della saliva (anidrasi carbonica) trasforma la CO2 in acido carbonico, percepito dagli stessi recettori dell’acido e del piccante. Chi ama il piccante tende a preferire l’acqua frizzante.","Bolle fini e fitte: sensazione vellutata, elegante, tipo champagne. Bolle grosse: più energiche, “speziate”, con un rilascio più aggressivo degli aromi.","Pressione di iniezione alta → bolle più fini, texture più delicata. Pressione bassa → bolle più grosse, texture più decisa.","Il freddo rende la frizzantezza più croccante; il caldo ammorbidisce e fa risaltare la dolcezza. Zuccheri e proteine cambiano tensione, viscosità e densità e quindi la sensazione."]},{"titolo":"3.3 Amplificazione degli aromi"},{"titolo":"","testo":"La gassatura non cambia gli aromi, ma modifica come li percepiamo: le bolle che scoppiano liberano goccioline e spingono gli aromi volatili verso il naso; l’acido carbonico rende il drink più acuto; alcuni composti ne escono rafforzati, altri indeboliti. Si distingue l’olfatto ortonasale (dal naso) e retronasale (dal fondo della bocca): quest’ultimo conta molto per il sapore. La partizione dei volatili descrive come un composto si divide tra liquido e aria: in recipiente chiuso gli aromi si accumulano nello spazio sopra il liquido, quindi il primo sorso o l’apertura danno un “colpo” di aroma."},{"titolo":"","tabella":[["Famiglia","Cosa succede con il gas","Esempi e consigli"],["Fumo (fenoli: guaiacolo, siringolo, cresoli, eugenolo, vanillina)","Più percepiti: diventano dominanti","Nel Bergamotto + Fumo bastano 10 ml di whisky torbato, nascosti tra ingredienti molto forti."],["Frutta (esteri: acetato di etile, butirrato di etile, acetato di isoamile...)","Svaniscono in fretta, meno persistenti","Bisogna aumentare gli ingredienti fruttati. Esempio: nel cocktail alla Pera quasi tutti gli ingredienti portano note di pera."],["Legno e resina (terpeni: alfa e beta pinene, limonene, mircene, terpinolene...)","Più percepiti, spesso dominano","Il ginepro del gin copre facilmente le note delicate."],["Floreale (ossido di rosa, beta-damascenone, iononi)","Meno ritenuti: evaporano e vengono sovrastati","La rosa è rilevabile a parti per miliardo; serve un rapporto sbilanciato a favore del liquore di rosa rispetto al gin."]]},{"titolo":"","testo":"Esempi di numeri: l’ossido di rosa si sente a circa 5 parti per miliardo; il beta-damascenone a 0,009 parti per miliardo. Una parte per miliardo equivale a un secondo in 32 anni."},{"titolo":"3.4 Bilanciare il drink per la gassatura"},{"titolo":"","punti":["Avere un cocktail perfetto da piatto non basta: dopo la gassatura il sapore cambia. Gli autori non danno una ricetta, ma un metodo: fare lotti piccoli, gassare, assaggiare, correggere.","Spirito alcolico: in genere ne serve meno rispetto agli ingredienti poco o per nulla alcolici (anche perché l’alcol degassa in fretta).","Dolce e acido: l’acido carbonico rende il drink più acuto, quindi può servire più dolcezza, ricordando che lo zucchero riduce il gas. Lo sciroppo 2:1 dà spesso più corpo di quello 1:1. Va ricordata anche la perdita di corpo dovuta alla diluizione già nel lotto.","Bergamotto + Fumo (esempio). Versione iniziale: 30 ml di whisky torbato più 10 ml di distillato torbato, carbonatato in fusto a 55 psi (3,8 bar): dopo il gas, rooibos e bergamotto quasi spariti e fumo fuori scala. Versione finale: solo 10 ml di whisky, più cordiale al rooibos (30 ml contro 15), sciroppo 2:1, più acqua di diluizione (75 ml contro 57,5) e 42 psi (2,9 bar). Per tre anni è stato tra i più venduti del locale, più di Margarita e Negroni.","Rosa (esempio). Versione iniziale con 25 ml di gin e 20 ml di liquore di rosa: dopo il gas la rosa spariva, dominavano ginepro, vermouth secco e cardamomo. Versione finale: liquore di rosa a 35 ml, gin ridotto a 12,5 ml, vermouth di rosa, vino arancione, un aperitivo analcolico e più acqua; il cardamomo viene spruzzato sul bicchiere.","Messaggio finale: l’acidità può diventare più vivace, le erbe più croccanti, il dolce può servire un aiuto per emergere. Ogni ingrediente reagisce in modo diverso: iterare, assaggiare, chiedere pareri."]},{"titolo":"PARTE 4 — COME SI FA"},{"titolo":"4.1 Attrezzatura"},{"titolo":"","punti":["Regolatore della CO2. Collega la bombola al sistema e mantiene stabile la pressione. Parti: manometro della bombola, meccanismo di regolazione (membrana o pistone), manopola, uscita, valvola di sicurezza, valvola a spillo per il flusso fine. Si avvita con chiave per evitare perdite. Con un adattatore si può usare anche una bombola SodaStream (CO2 alimentare, ma con filettatura diversa).","Tubi del gas e di erogazione. Di materiale alimentare (PVC, polietilene, poliuretano), flessibili, trasparenti, resistenti alla pressione (di solito 30-60 psi, cioè 2,1-4,1 bar). Diametri interni comuni da 3/16 a 1/4 di pollice; Crossroads usa 3/8.","Attacchi a sfera (ball lock). Collegano gas e liquido ai fusti e ai tappi per PET. Grigi per il gas (con valvola unidirezionale integrata, preferiti), neri per il liquido. Raccordi filettati più sicuri di quelli a barbe.","Fusti Cornelius. In acciaio inox, guarnizioni di gomma o silicone, capacità comuni 19 l e 9,5 l, valvola di sfogo sul coperchio, raccordi standard per gas (ingresso) e liquido (uscita) con tubo pescante fino al fondo.","Tappi di carbonatazione per PET. Meglio in acciaio inox: quelli di plastica si consumano (tre mesi contro tre anni e mezzo) e possono trasformarsi in un “proiettile”. Rimuovere l’anello di plastica del tappo della bottiglia prima di avvitare.","Bottiglie PET. Usare solo bottiglie nate per bibite gassate, mai quelle per bevande naturali. Controllare crepe e che il collo sia rotondo, non ovale. Pulirle, sanificarle e sostituirle ogni tanto.","Pietre di diffusione. Porose, in ceramica (più economiche) o in acciaio inox (più igieniche e resistenti), con pori da 0,5, 2 o 5 micron. Danno bolle più piccole e meno rischio di eccesso; si possono intasare. Pulire con detergente neutro o acqua bollente per 2-5 minuti; se intasate, 10 secondi in acido cloridrico e sciacquo. Toccarle con guanti sanificati.","Manometro. Misura la pressione dentro il fusto o la bottiglia e permette di capire se il drink è sotto o sovra carbonatato, usando poi il grafico di equilibrio.","Rubinetti. In acciaio o ottone, meglio con regolazione del flusso per ridurre la schiuma.","Raccordi John Guest. Attacchi a pressione senza attrezzi: il tubo si inserisce, una ghiera lo blocca e una guarnizione tiene la tenuta. Per staccare si preme la ghiera e si tira il tubo.","Valvola unidirezionale. Impedisce al liquido di tornare indietro. Se il cocktail entra nei tubi del gas, vanno sostituiti, perché contaminano ogni fusto successivo.","Boa di cantina. Galleggiante che si abbassa quando il fusto è finito o c’è schiuma, bloccando il flusso così che aria e gas non entrino nella linea.","Pistole Pluto. Economiche, tubi deboli e non isolati, adatte a poco più che a un gioco: sconsigliate."]},{"titolo":"Lunghezza e resistenza delle linee"},{"titolo":"","testo":"Più la linea è lunga, più scende la pressione al rubinetto. Se è troppa o troppo poca, il drink esce schiumoso o piatto. Esistono due resistenze: quella di attrito nel tubo e quella del dislivello (circa 0,5 psi per piede, cioè 30 cm, di salita; se il rubinetto è sotto il fusto si guadagna)."},{"titolo":"","tabella":[["Tubo","Materiale","Resistenza (psi per piede)"],["3/16 pollici","Vinile","3"],["1/4 pollice","Vinile","0,85"],["3/16 pollici","Polietilene","2,2"],["1/4 pollice","Polietilene","0,5"],["3/8 pollice","Acciaio inox","0,2"],["5/16 pollice","Acciaio inox","0,5"],["1/4 pollice","Acciaio inox","2"]]},{"titolo":"","punti":["Lunghezza della linea = (pressione del fusto − pressione desiderata al rubinetto − 0,5 × dislivello in piedi) ÷ resistenza per piede. Si punta a circa 1 psi al rubinetto (o zero).","Esempio: fusto a 12 psi (0,83 bar, a 4,5 °C circa 5 g/l), tubo di vinile 3/16 (3 psi per piede): serve circa 3,67 piedi (1,1 m). Con tubo di vinile da 1/4 si arriva a circa 12,9 piedi (circa 3,9 m).","Pressione di erogazione = pressione di equilibrio per il livello di gas voluto alla temperatura del fusto + resistenza totale della linea + 0,5 psi per piede di salita. Esempio del libro: 12 + 22 + 1 = circa 35 psi (2,4 bar) per una linea di 10 piedi (3 m) con 2 piedi di dislivello."]},{"titolo":"Pulizia delle linee"},{"titolo":"","punti":["Almeno ogni due settimane. Sciacquare con acqua a temperatura ambiente (mai calda), far circolare un detergente specifico (meglio colorato, viola, per vedere se è stato tolto), muovere il liquido ogni cinque minuti circa, poi risciacquare a fondo e provare le linee."]},{"titolo":"Raffreddare durante l’erogazione"},{"titolo":"","tabella":[["Sistema","Temperatura tipica","Capacità e note"],["A glicole","−2 / 2 °C","Alta, bene su lunghe distanze, installazione complessa."],["Ad aria","3 / 7 °C","Media, installazione facile, adatto a linee corte."],["Jockey box / piastre fredde","0 / 4 °C","Bassa-media, portatile, senza elettricità, per eventi."],["Termoelettrici","3 / 7 °C","Bassa-media, per piccoli sistemi."],["Banco di ghiaccio","−2 / 2 °C","Alta e efficiente: quello usato da Crossroads, richiede spazio."]]},{"titolo":"","punti":["Frigo o freezer con tubi che passano da fori: possibile ma poco efficiente. Un fusto impiega almeno 36 ore per raffreddarsi e i tubi non isolati scaldano il drink. Gli autori non lo userebbero.","Erogatori da banco con refrigerazione integrata: semplici, con 30 minuti di preraffreddamento; ottimi per eventi esterni.","Il refrigeratore di flusso (anche da quattro linee, circa 450 sterline di seconda mano) è raccomandato sempre che si può."]},{"titolo":"4.2 Sicurezza — i 20 fili della rete"},{"titolo":"","punti":["Avere sempre un regolatore.","Chiudere la valvola del gas a fine uso, controllare perdite (sibilo): in ambienti chiusi la CO2 si accumula e causa mal di testa, vertigini, confusione, perdita di coscienza e in casi estremi soffocamento. Cambiare il raccordo che perde.","Controllare che tutta l’attrezzatura sia montata bene.","Fissare la bombola al muro con una catena (pressione a 20 °C intorno a 830 psi, cioè circa 57 bar); proteggere il regolatore con una gabbia di metallo.","Tenere il drink freddo sempre: più caldo, più pressione e rischio di schizzi e spruzzi.","Aprire le PET con presa sicura sul tappo: la pressione lo spinge con forza.","Evitare fonti di calore vicino alla bombola: a 20 °C circa 830 psi, a 30 °C circa 1.100 psi, a 50 °C circa 2.000 psi, a 70 °C circa 3.000 psi (si attiva la valvola di sicurezza).","Guarnizioni sempre pulite e in buono stato.","Scaricare completamente il fusto prima di aprirlo, con la valvola di sfogo.","Conoscere (e controllare) la pressione massima del recipiente: 130 psi per i fusti Cornelius, 150 psi per le PET; non avvicinarsi mai.","Non tutte le PET sono uguali; sostituirle nel tempo.","Saper cambiare la bombola: chiudere la valvola, chiave giusta, ricontrollare la chiusura, catena, svitare il regolatore, cambiare la bombola, riassicurarla, togliere il cappuccio, riavvitare il regolatore, aprire il gas solo alla fine.","Non sollevare né scuotere i fusti: farli rotolare.","Pulire gli attacchi con un sanificante acido senza risciacquo (ChemSan allo 0,2%, due minuti di contatto, non su metalli teneri, con protezioni).","Igiene generale e attenzione ai prodotti fermentati.","Rispettare e conservare bene i prodotti chimici (non mescolarli, stoccaggio ventilato).","Rispettare i dosaggi.","Risciacquare molto bene le linee.","Usare guanti e protezioni.","Non usare acqua molto calda per pulire le linee: la pressione può far esplodere la boa di cantina."]},{"titolo":"4.3 Installazione"},{"titolo":"","punti":["Montare il regolatore sulla bombola con la chiave; inserire il tubo del gas nel regolatore (tirare per verificare); collegare il tubo al raccordo John Guest; avvitare la valvola unidirezionale e poi l’attacco a sfera. A quel punto si può gassare.","Schema di Crossroads. Bombola con regolatore primario a muro, regolatori secondari, fusti in cantina refrigerata, boa di cantina, refrigeratore di flusso, linee raggruppate con tubi di raffreddamento accanto, torre con rubinetti. Raccordi John Guest e attacchi a sfera.","Per la prima installazione gli autori consigliano un professionista qualificato (nessuna perdita, collegamenti sicuri, garanzia)."]},{"titolo":"4.4 Preparazione in lotti"},{"titolo":"","testo":"Per gassare un cocktail bisogna prepararlo in lotto: tutto insieme, anche ingredienti deperibili (succhi, tè, vini, vermouth), perché freddo, acidità e assenza di ossigeno prolungano molto la vita del drink. Da evitare solo sedimenti, pectine e proteine. Le “dieci regole” in sintesi:"},{"titolo":"","punti":["1. Sapere quali ingredienti vanno bene (chiarificare i succhi, usare aceti o acidi al posto degli agrumi).","2. Ricetta scritta chiaramente e condivisa (file online). Partire dagli ingredienti più economici; lasciare per ultimi quelli di lunga preparazione.","3. Rendere tutto a prova di errore: misure, categoria e marca del prodotto.","4. Calcolare le quantità una volta per tutte in base al recipiente, e scriverle già pronte.","5. Avere tutti gli ingredienti prima di iniziare.","6. Evitare le distrazioni e tenere traccia di cosa si è già versato (lista da barrare, o spostare le bottiglie da un lato all’altro).","7. Mai misurare nel contenitore dove si mescola: misurare a parte.","8. Pulizia, per evitare contaminazioni e allergeni.","9. Strumenti precisi: Crossroads pesa gli ingredienti con una bilancia invece di misurarli a volume (serve calcolare le densità, ma è molto più preciso).","10. Assaggiare, sempre: il palato conta più dei numeri.","Bonus: divertirsi e trattare tutti con rispetto."]},{"titolo":"4.5 La procedura passo passo (25 punti, sintesi)"},{"titolo":"","tabella":[["Fase","Cosa fare"],["Preparazione","1-2. Capire la teoria. 3. Progettare il drink con altre persone (non farlo da soli). 4. Provare l’iniezione su una piccola quantità per vedere come cambiano i sapori. 5. Correggere. 6. Calcolare la ricetta per il lotto. 7. Preparare il lotto. 8. Mescolare bene (soprattutto nei fusti da 19 l: il liquido si preleva dal fondo e se non è omogeneo i componenti più pesanti escono per primi)."],["Raffreddare e impostare","9. Abbassare la temperatura il più possibile. 10. Impostare il regolatore alla pressione voluta. 11. Per le PET, spremere fuori l’aria e avvitare il tappo. 12. Collegare il gas (attacco a sfera con scatto) e, per i fusti, scegliere se usare la sola uscita (tubo pescante) o un coperchio con pietra. 13-14. Aprire il gas e far entrare la CO2."],["Scaricare l’aria","15. Primo sfiato per eliminare l’aria e i gas indesiderati. Nelle PET, agitare già forte e svitare lentamente il tappo (la pressione può spararlo via). Nei fusti, far entrare un po’ di gas e sfiatare con il fusto in verticale."],["Gassare","16. Agitare: PET capovolte per iniettare nel liquido; fusti coricati rotolati coi piedi. 17. Ripetere: Crossroads gassa le PET 2-3 volte e i fusti 3-4 volte. Rifarlo dieci volte non migliora, porta solo al troppo gas. 18. Riposo: circa 1 ora tra un ciclo e l’altro (10-15 minuti basta per le PET; il fusto resta collegato per tutto il processo). 19. Agitare di nuovo con energia."],["Riposare e servire","20. Dopo l’ultimo ciclo lasciar riposare, senza servire subito. 21. Tenere al freddo, idealmente in uno spazio refrigerato. 22. Servire: dalle PET si svita lentamente il tappo, si inclina il bicchiere e si versa; dal fusto si collegano correttamente gas (IN) e liquido (OUT), si spurga l’aria dalla boa e dalla linea (premere in alto per qualche secondo e rimettere su il galleggiante), si versa finché il liquido non “salta” più, e si recupera il primo scarto per lasciarlo degassare e riusarlo."],["Dopo","23. Regolare la pressione di erogazione se serve (temperatura, tubo, dislivello). 24. Nelle PET, ogni apertura fa perdere gas: se non si serve tutto subito, serve una ricarbonatazione (un solo ciclo basta, con riposo). Tenere pronta una bottiglia di scorta già fredda e riposata. 25. Se ci si accorge di un errore nel lotto, scaricare completamente, correggere, lasciare il contenitore aperto una notte per far uscire tutto il gas e solo dopo ricominciare, per non sovracarbonare."]]},{"titolo":"RISOLUZIONE DEI PROBLEMI (SINTESI)"},{"titolo":"","tabella":[["Problema","Cause probabili","Cosa fare"],["Nessuna gassatura","Bombola vuota o valvola chiusa; collegamento scadente.","Cambiare la bombola, aprire la valvola, stringere e verificare le perdite con acqua saponata. Resta sempre un po’ di CO2 nella linea, che può gonfiare la bottiglia e dare l’idea che il gas entri."],["Gassatura debole","Pressione di equilibrio troppo bassa, poca agitazione, poco tempo, liquido troppo caldo, cocktail non adatto, pressione di erogazione sbagliata.","Scaricare e ricominciare, aumentare la pressione, agitare di più e più a lungo, dare tempo, raffreddare, ricalcolare la pressione di erogazione."],["Troppo gas","Pressione di iniezione troppo alta; collegamento troppo lungo; recipiente troppo vuoto (non rispettata la regola ¾ – ¼).","Sfiatare con delicatezza e attendere; se persiste, scaricare del tutto e ricominciare. La volta dopo: provare a pressioni diverse con lotti piccoli."],["Perdite di CO2","Collegamenti allentati, tubo forato, guarnizioni rovinate, adattatore sbagliato o sporco.","Stringere, controllare con acqua saponata, cambiare le guarnizioni, avere sempre guarnizioni di scorta, tenere puliti gli attacchi dai residui di zucchero."],["Sapore piatto dopo la gassatura","Poco tempo o troppo gas; regolatore guasto; PET aperta troppo in fretta.","Scaricare e ricominciare, controllare il regolatore, aprire le PET lentamente e ricarbonatare."],["Sapore strano","Attrezzatura o bombola sporche; troppo gas (amaro).","Cambiare linea e fusto, pulire a fondo, usare CO2 alimentare."],["Sibilo del gas","Perdita o collegamento allentato.","Sicurezza: fermare subito, chiudere la bombola, stringere i collegamenti. Se il sibilo continua, scollegare bombola e regolatore e verificare le loro condizioni."],["Liquido che spruzza dal recipiente","Connettore mal posizionato, guarnizioni difettose.","Staccare in sicurezza e rimontare bene, sostituire la guarnizione. Attenzione: resta un recipiente in pressione."],["Troppa schiuma","Composizione (proteine, zuccheri, alcol, pectina, impurità), troppo gas, liquido caldo, aria nella linea.","Spruzzare alcol o oli di agrume come antischiuma, scaricare e ricominciare, raffreddare. Con la linea: spurgare finché non c’è più aria; il fusto vuoto o senza gas fa cadere la boa."],["Liquido che “salta” dal rubinetto","Aria nella linea.","Far scorrere liquido fino a eliminare le bolle (il liquido recuperato si può sgassare e riusare)."],["Nessun liquido dal rubinetto","Fusto vuoto, gas di erogazione finito, boa scesa per schiuma.","Cambiare fusto o bombola, svuotare la boa e controllare le cause della schiuma."],["Tutti i rubinetti hanno un retrogusto di un drink","Liquido entrato nel tubo del gas.","Meglio cambiare il tubo del gas (le valvole unidirezionali servono a questo)."],["Liquido torbido e schiumoso all’improvviso","Sedimento sul fondo del fusto quasi vuoto.","Agitare delicatamente il fusto; se è quasi finito, sostituirlo e far scorrere la linea. Il liquido torbido (2-3 litri) si può recuperare: sgassare e chiarificare di nuovo."],["Boa di cantina esplosa","Acqua troppo calda per pulire le linee.","Sostituirla; per pulire usare solo acqua fredda o a temperatura ambiente."]]},{"titolo":"APPENDICE — COME CAMBIANO GLI AROMI CON IL GAS (TABELLA DEL LIBRO, SINTESI)"},{"titolo":"","testo":"Il libro elenca circa 50 composti con la presenza percepita nei drink gassati rispetto a quelli piatti (una, due o tre frecce). Ecco il quadro per gruppi."},{"titolo":"","tabella":[["Tendenza","Composti principali (dove si trovano)"],["Molto più percepiti (+++)","Guaiacolo (fumo, legno); cresoli (catrame); alfa-pinene (pini, rosmarino)."],["Più percepiti (++)","3,5-dimetossitoluene (chiodi di garofano, tabacco); eugenolo (chiodi di garofano, cannella); mircene (luppolo); alfa-terpineolo (lillà, fiori di lime)."],["Un po’ più percepiti (+)","Acetaldeide; benzaldeide (mandorla, nocciolo di ciliegia); canfora; cinnamaldeide; citrale; citronellale; isovaleraldeide; limonene; antranilato di metile (uva Concord, gelsomino); vanillina."],["Un po’ meno percepiti (−)","Acetoina e diacetile (burro); acetato di etile, cinnamato, decanoato, eptanoato, esanoato, nonanoato, ottanoato, undecilenato di etile (frutta, vino); furfurale; acetato di isoamile; linalolo; nerolidolo; ottanale; lattoni gamma (decalattone, dodecalattone, nonalattone, undecalattone: pesca, cocco); allil cicloesilpropionato."],["Molto meno percepiti (−−)","Butirrato di etile (ananas); geraniolo e acetato di geranile (rosa, geranio); alcol isoamilico."],["Molto meno percepiti (−−−)","Beta-damascenone (rosa, mela); cis-ossido di rosa (rosa)."]]},{"titolo":"","testo":"Lettura pratica: nei drink gassati aumentano fumo, legno, resina e spezie; calano frutta (esteri), pesca/cocco (lattoni), burro e soprattutto i fiori di rosa. Si compensa portando più ingredienti fruttati o floreali e riducendo quelli affumicati e resinosi."},{"titolo":"NOTE MIE SUI NUMERI DEL LIBRO"},{"titolo":"","punti":["Esperimento 3 (acidità). Il libro scrive un aumento del 31% passando da circa 7,1 a circa 8,3 g/l, ma da quei due valori l’aumento viene circa il 17-19%. In ogni caso l’effetto è concreto.","Resistenza del vinile 3/16. La tabella dice 3 psi per piede, mentre l’esempio sulla pressione di erogazione usa 2,2 (che è il valore del polietilene da 3/16).","Esempio di pressione di erogazione. Parte da 2 g/l a 3 °C (12 psi), valore scelto come esempio: i cocktail del libro stanno intorno a 5-6,5 g/l, quindi la pressione reale sarebbe diversa.","Temperature della bombola. Il libro indica “30 °C (circa 37 °F)”: 30 °C sono in realtà 86 °F. È un refuso.","Unità. Le misure in piedi e psi sono quelle del libro; bar e metri li ho aggiunti io per comodità."]},{"titolo":"FONTI"},{"titolo":"","testo":"Riassunto basato sull’intero libro “Bubbles: A Guide to Carbonated Cocktails” di Bart Miedeksza e Valentino Girotto (Crossroads Consulting, prima edizione 2024, 328 pagine), dalla prefazione alle appendici. Il libro cita a sua volta come fonti principali: manuali di chimica di LibreTexts, ricerche sull’aroma delle rose (Journal of Food and Drug Analysis), studi sulla nucleazione delle bolle in liquidi gassati (ScienceDirect), articoli di fisica delle bevande frizzanti (Physics Today), il National Institutes of Health sul recettore del gusto della gassatura, e Catalina Cylinders sui pericoli del calore per le bombole."}]}];
