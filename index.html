  var S={role:null,busy:false,panel:null,creating:false,msg:"",authReady:false,issues:null,delId:null,dup:{},dupg:[],target:null,ricette:null,lezioni:null,menu:null,appunti:null,bicchieri:null,serate:null,impostazioni:null,ord:null,srSt:"",tab:"cocktail",q:"",open:null,scale:1,onlyIdx:null,onlyScaled:false,perVal:"",divVal:"",calc:{brix:"",target:"62",qty:""},unit:"ml",err:null,db:null,canEdit:false,edit:false,confirmDel:false,formErr:""};
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()}
  /* nella sezione Blend il nome compare sempre con «Blend» davanti (se non c'è già) */
  function dn(r){if(!r)return "";var n=String(r.nome||r.id||"");if(r.cat!=="blend")return n;n=n.trim();return /^blend/i.test(n)?n.charAt(0).toUpperCase()+n.slice(1):"Blend "+n}
  /* bicchieri: elenco con capienza in ml; la ricetta ricorda l'id del bicchiere */

  /* ---- ingredienti: scala il numero iniziale e converte ml, cl, oz ---- */
  var NUM=/^(\d+(?:[.,]\d+)?(?:\s+\d\/\d)?|\d\/\d)(?!\d|%|\/)\s*(.*)$/;
  var UNIT=/^(ml|cl|oz|gr|g|kg|l|litri|litro|drop|dash|dr|dh|bs|parti|parte|cucchiaino|cucchiaio|cucchiai|tsp|tbsp)\b\s*(.*)$/i;
  function toNum(s){s=s.trim();var m=s.match(/^(\d+)\s+(\d)\/(\d)$/);if(m)return +m[1]+ +m[2]/+m[3];m=s.match(/^(\d)\/(\d)$/);if(m)return +m[1]/+m[2];return parseFloat(s.replace(",","."))}
  function fmt(n){var r=Math.round(n*100)/100;return String(r).replace(".",",")}
  function fmtOz(n){var q=Math.round(n*4)/4;if(q===0&&n>0)q=0.25;var w=Math.floor(q),f=q-w;var fr=f===0.25?"1/4":f===0.5?"1/2":f===0.75?"3/4":"";return ((w?String(w):"")+(w&&fr?" ":"")+fr)||"0"}
  function fmtPz(n){return Math.abs(n*4-Math.round(n*4))<1e-9?fmtOz(n):fmt(n)}
  var RNG=/^(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)\s+(.*)$/;
  function conv(num,k,u){
    var val=num*k,uu=u;
    if(S.unit==="oz"){if(u==="ml"){val/=OZ;uu="oz"}else if(u==="cl"){val/=OZ/10;uu="oz"}}
    else{if(u==="cl"){val*=10;uu="ml"}else if(u==="oz"){val*=OZ;uu="ml"}}
    return {s:(S.unit==="oz"&&uu==="oz")?fmtOz(val):fmt(val),u:uu};
  }
  function split(text,k){
    var tp=text.match(/^top\s+(.+)$/i);
    if(tp){var r0=split(tp[1],k);return {q:"top"+(r0.q?" "+r0.q:""),t:r0.t}}
    var rg=text.match(RNG);
    if(rg){
      var ru=rg[3].match(UNIT),u1=ru?ru[1].toLowerCase():"",a=conv(toNum(rg[1]),k,u1),b=conv(toNum(rg[2]),k,u1);
      return {q:a.s+"-"+b.s+(ru?" "+a.u:""),t:ru?ru[2]:rg[3]};
    }
    var m=text.match(NUM);
    if(!m)return {q:"",t:text};
    var unit=m[2].match(UNIT),num=toNum(m[1]);
    if(isNaN(num))return {q:"",t:text};
    var c=conv(num,k,unit?unit[1].toLowerCase():"");
    var rest=unit?unit[2]:m[2];
    /* pezzi dopo l'unità (es. "180 gr 4 cetriolini", "600 ml 3 Ginger beer"): si moltiplicano anche loro; "3 Star", "12 anni" restano nomi */
    if(unit&&k!==1){var pz=rest.match(/^(\d+(?:[.,]\d+)?(?:\s+\d\/\d)?|\d\/\d)(?!\d|%|\/)\s+(?!star|stars|stelle|anni|years?|y\.?o)(\S.*)$/i);
      if(pz){var pn=toNum(pz[1]);if(!isNaN(pn))rest=fmtPz(pn*k)+" "+pz[2]}}
    return {q:c.s+(unit?" "+c.u:""),t:rest};
  }
  /* ---- quantità totale di una ricetta, in ml (gr contati come ml) ---- */
  function toMl(v,u){switch(u){case"ml":case"gr":case"g":return v;case"cl":return v*10;case"oz":return v*OZ;case"kg":case"l":case"litri":case"litro":return v*1000;default:return null}}
  function mlOf(text){
    var rg=text.match(RNG);
    if(rg){var ru=rg[3].match(UNIT);if(!ru)return null;return toMl((toNum(rg[1])+toNum(rg[2]))/2,ru[1].toLowerCase())}
    var m=text.match(NUM);if(!m)return null;var un=m[2].match(UNIT);if(!un)return null;
    var v=toNum(m[1]);return isNaN(v)?null:toMl(v,un[1].toLowerCase());
  }
  /* ingrediente scelto in "Ho solo": quantità di base nell'unità che l'utente scrive (ml o oz; gr per i solidi) */
  function onlyBase(text){
    if(RNG.test(text))return null;
    var m=text.match(NUM);if(!m)return null;var un=m[2].match(UNIT);if(!un)return null;
    var v=toNum(m[1]);if(isNaN(v)||v<=0)return null;var u=un[1].toLowerCase();
    if(u==="gr"||u==="g")return {b:v,lab:"gr",name:un[2]};
    if(u==="kg")return {b:v*1000,lab:"gr",name:un[2]};
    var ml=toMl(v,u);if(ml==null)return null;
    return {b:S.unit==="oz"?ml/OZ:ml,lab:S.unit,name:un[2]};
  }
  function baseMl(r){var t=0,skip=0;(r.ing||[]).forEach(function(x){var v=mlOf(x);if(v==null)skip++;else t+=v});return {t:t,skip:skip}}

  /* ---- cose da controllare ---- */
  function okHas(r,k){return (r.ok||[]).indexOf(k)>=0}
  var COUNTABLE=/^(foglie|foglia|fette|fetta|cubett|gocce|goccia|spicchi|spicchio|chiodi|baccell|sfere|sfera|noccioli|olive|ciliegi|limoni|lime\b.*(interi|intero)|uova|uovo|bustin|stecche|stecca|fave|fava)/i;
  function numIssues(r){
    var out=[],isC=r.cat==="cocktail"||r.cat==="analcolico";
    (r.ing||[]).forEach(function(x){
      var rg=x.match(RNG);
      if(rg){if(toNum(rg[1])>toNum(rg[2]))out.push("«"+x+"»: intervallo al contrario");return}
      var m=x.match(NUM);if(!m)return;
      var n=toNum(m[1]);if(isNaN(n))return;
      var un=m[2].match(UNIT);
      var fr=m[1].match(/(\d)\/(\d)$/);
      if(fr&&[2,3,4,8].indexOf(+fr[2])<0)out.push("«"+x+"»: frazione insolita");
      if(!un&&n>=10&&!COUNTABLE.test(m[2]))out.push("«"+x+"»: quantità senza unità di misura");
      if(isC&&un){var ml=toMl(n,un[1].toLowerCase());if(ml!=null&&ml>400)out.push("«"+x+"»: quantità molto alta per un cocktail")}
    });
    if(isC){var b=baseMl(r);if(b.t>300)out.push("Totale degli ingredienti "+fmt(b.t)+" ml: molto alto per un drink");}
    return out;
  }
  function noteIssue(r){

    return /da verificare|da confermare|da controllare|non (è )?(specificat|indicat|chiar)|base non|manca|probabilmente|forse|incomplet|dubbi/i.test(t)?(r.note||"Un ingrediente non è specificato."):null;
  }
  function buildIssues(){
    var secs={inc:[],num:[],nota:[],dup:[],nome:[]},byId={};
    S.ricette.forEach(function(r){byId[r.id]=r});
    S.ricette.forEach(function(r){
      if(inc(r))secs.inc.push({r:r,kind:"inc",text:r.note||"Ricetta segnata come incompleta."});
      else{var nt=okHas(r,"nota")?null:noteIssue(r);if(nt)secs.nota.push({r:r,kind:"nota",text:nt})}
      if(!okHas(r,"numeri")&&!inc(r)){var ni=numIssues(r);if(ni.length)secs.num.push({r:r,kind:"numeri",text:ni.join("\n")})}
      (S.dup[r.id]||[]).forEach(function(g){
        if(g.tipo==="nome")return;
        var txt=g.label+": "+g.ids.filter(function(id){return id!==r.id}).map(function(id){var x=byId[id];return x?dn(x)+(x.fonte?" ("+x.fonte+")":""):""}).filter(Boolean).join(", ");
        secs.dup.push({r:r,kind:"dup",text:txt});
      });
    });
    Object.keys(secs).forEach(function(k){secs[k].sort(function(a,b){return a.r.cat===b.r.cat?byName(a.r,b.r):a.r.cat.localeCompare(b.r.cat)})});
    return secs;
  }

  /* ---- calcolatori ---- */
  function cnum(v){var n=parseFloat(String(v==null?"":v).replace(",","."));return isNaN(n)?NaN:n}
  function calcOut(){
    var c=S.calc,b=cnum(c.brix),t=cnum(c.target),q=cnum(c.qty);
    if(isNaN(b)||isNaN(t))return '<p class="src">Scrivi il grado Brix del liquido e la quantità in grammi.</p>';
    if(b<0||b>=100||t<=0||t>=100)return '<p class="err">Il grado Brix deve stare tra 0 e 100.</p>';
    var h="";
    if(t<62)h+='<p class="err"><b>Attenzione:</b> '+fmt(t)+' Brix è sotto il minimo di 62. Sotto i 62 Brix non è uno sciroppo ma una premiscela, e si conserva meno.</p>';
    else if(t>66.7)h+='<p class="err"><b>Attenzione:</b> '+fmt(t)+' Brix è sopra il massimo di 66,7 (lo sciroppo 2:1). Oltre questo grado lo zucchero rischia di non sciogliersi del tutto o di cristallizzare.</p>';
    if(t<=b)return h+'<p class="note">Il liquido è già a '+fmt(b)+' Brix: più o uguale al grado voluto ('+fmt(t)+'). Non serve aggiungere zucchero.</p>';
    if(q>0){

  /* ---- doppioni ---- */
  var STOP={di:1,al:1,alla:1,e:1,il:1,la:1,sciroppo:1,syrup:1,hm:1,dei:1,del:1,della:1,"in":1};
  function nameKey(r){return norm(dn(r).replace(/\(.*?\)/g,"")).split(" ").filter(function(w){return w&&!STOP[w]}).sort().join(" ")}
  function sigKey(r,noq){return (r.ing||[]).map(function(x){return norm(noq?x.replace(/^[\d\/.,\s-]+(ml|cl|oz|gr|g|kg|l|dash|dh|drop|bs)?\b/i,""):x)}).sort().join("|")}
  function dupCompute(){
    var info={},groups=[];
    if(!S.ricette){S.dup=info;S.dupg=groups;return}
    var TYPES=[["identica","Ricetta identica a",function(r){return (r.ing||[]).length>1?sigKey(r,false):null}],
               ["ingredienti","Stessi ingredienti (quantità diverse) di",function(r){return (r.ing||[]).length>1?sigKey(r,true):null}],
               ["nome","Stesso nome di",function(r){return nameKey(r)||null}]];
    TYPES.forEach(function(t){
      var map={};
      S.ricette.forEach(function(r){if(okHas(r,"dup"))return;var k=t[2](r);if(k==null)return;var kk=r.cat+"§"+k;(map[kk]=map[kk]||[]).push(r)});
      Object.keys(map).forEach(function(k){
        var g=map[k];if(g.length<2)return;
        var ids=g.map(function(r){return r.id});
        var already=groups.some(function(o){return ids.every(function(id){return o.ids.indexOf(id)>=0})});
        if(already)return;
        var grp={tipo:t[0],label:t[1],ids:ids,titolo:dn(g[0]).replace(/\s*\(.*?\)/g,"")};
        groups.push(grp);
        ids.forEach(function(id){(info[id]=info[id]||[]).push(grp)});
      });
    });
    S.dup=info;S.dupg=groups;
  }
  /* collegamenti fatti a mano: la ricetta ricorda, per ogni ingrediente (per nome), l'id della preparazione collegata */
  function collKey(name){return norm(String(name||"").replace(/\(.*?\)/g,""))}
  function linkFor(name,rec){
    if(rec&&rec.coll){var ck=collKey(name),cid=ck&&rec.coll[ck];if(cid){var cm=S.ricette.filter(function(x){return x.id===cid})[0];if(cm)return cm}}
    var n=norm(name.replace(/\(.*?\)/g,""));if(n.length<4)return null;
    var l=S.ricette.filter(function(r){return r.cat!=="cocktail"&&r.cat!=="analcolico"&&!inc(r)&&(norm(r.nome.replace(/\(.*?\)/g,""))===n||norm(dn(r).replace(/\(.*?\)/g,""))===n||(r.alias||[]).some(function(a){return norm(a.replace(/\(.*?\)/g,""))===n}))});
    return l.length?l[0]:null;
  }

  /* ---- serate: drink totali, quote in percentuale, numeri e quantità calcolati ---- */
  function serataModel(id){return (S.serate||[]).filter(function(x){return x.id===id})[0]}
  function recById(id){return (S.ricette||[]).filter(function(x){return x.id===id})[0]}
  function srNum(sr,row){return Math.round((cnum(sr.totale)||0)*(cnum(row.quota)||0)/100)}
  var ALCOL=/rum|havana|appleton|myers|plantation|dark|veritas|wray|gosling|abuelo|bally|troy|montebello|cura[cç]ao|peach|brandy|pernod|angostura|pierre ferrand|oftd|saint james|cacha|gin\b|vodka|whisk|tequila|mezcal|bitter|campari|vermouth|liquore|amaro|reserve|3 star|wild turkey|pisco|cognac/i;
  function srParse(text){
    var rg=text.match(RNG),m,un,n,name,u;
    if(rg){var ru=rg[3].match(UNIT);n=(toNum(rg[1])+toNum(rg[2]))/2;u=ru?ru[1].toLowerCase():"";name=ru?ru[2]:rg[3]}
    else{m=text.match(NUM);if(!m)return null;n=toNum(m[1]);un=m[2].match(UNIT);u=un?un[1].toLowerCase():"";name=un?un[2]:m[2]}
    if(isNaN(n))return null;
    name=name.replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim();
    var q=n,uu=u||"pz";
    if(!u){var w=name.match(/^(pz|pezzi|pezzo|teaspoons?|bar ?spoons?|spoons?)\b\s*(.*)$/i);
      if(w){var wl=w[1].toLowerCase();uu=/^(pz|pezz)/.test(wl)?"pz":/^teaspoon/.test(wl)?"cucchiaini":"bar spoon";name=w[2]||name}}
    if(u==="cl"){q=n*10;uu="ml"}else if(u==="oz"){q=n*OZ;uu="ml"}else if(u==="l"||u==="litri"||u==="litro"){q=n*1000;uu="ml"}
    else if(u==="g"||u==="gr"){uu="gr"}else if(u==="kg"){q=n*1000;uu="gr"}
    else if(u==="dh"||u==="dash"){uu="dash"}else if(u==="dr"||u==="drop"){uu="gocce"}
    return {q:q,u:uu,name:name};
  }
  function srAdd(text,k,depth,acc,skip){
    var p=srParse(text);
    if(!p){var t=String(text).replace(/\(.*?\)/g,"").trim();if(t&&skip.indexOf(t)<0)skip.push(t);return}
    if(p.u==="ml"&&depth<3){
      var ln=linkFor(p.name);
      if(ln&&ln.cat==="blend"){var T=baseMl(ln).t;if(T>0){(ln.ing||[]).forEach(function(x){srAdd(x,k*p.q/T,depth+1,acc,skip)});return}}
    }
    var key=p.u+"|"+norm(p.name);
    if(!acc[key])acc[key]={name:p.name,u:p.u,q:0};
    acc[key].q+=p.q*k;
  }
  function srNeeds(sr){

      (r.ing||[]).forEach(function(x){srAdd(x,n,0,acc,skip)});

    var list=function(L){return '<ul class="ing">'+L.map(function(it){return '<li><span class="q" style="min-width:8.5rem">'+esc(srQty(it))+'</span><span class="t">'+esc(it.name)+'</span></li>'}).join("")+'</ul>'};

  function ghCommitFile(mut,msg,tries){
    return ghReq("GET").then(function(cur){
      var file=JSON.parse(dec8.decode(b64d(cur.content.replace(/\n/g,""))));
      return mut(file).then(function(nf){return ghReq("PUT",{message:msg,content:btoa(JSON.stringify(nf)),sha:cur.sha,branch:GH.b}).then(function(){return nf})});
    }).catch(function(e){if((e.status===409||e.status===422)&&tries>0)return ghCommitFile(mut,msg,tries-1);throw e});
  }
  var chain=Promise.resolve();
  function commit(mut,msg){var p=chain.then(function(){return ghCommitFile(mut,msg,3)});chain=p.catch(function(){});return p}
  function applyOp(fn,msg){
    var out;
    return commit(function(file){return readData(file,S.dk).then(function(d){fn(d);out=d;return writeData(file,S.dk,d)})},msg).then(function(nf){S.file=nf;S.lastSave=Date.now();setBase(out)});
  }
  function makeDb(){
    return {doc:function(p){var a=p.split("/");return {
      set:function(d){return applyOp(function(x){(x[a[0]]=x[a[0]]||{})[a[1]]=d},"Modifica dal sito: "+p)},
      delete:function(){return applyOp(function(x){if(x[a[0]])delete x[a[0]][a[1]]},"Elimina dal sito: "+p)}
    }}};
  }
  /* aggiornamento automatico: vedo anche le modifiche fatte da altri (o da Claude) */
  function fetchFresh(){
    return fetch("https://api.github.com/repos/"+GH.o+"/"+GH.r+"/contents/"+GH.p+"?ref="+GH.b+"&t="+Date.now(),{headers:{Accept:"application/vnd.github.raw+json"},cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json()}).catch(function(){return fetchFile()});
  }
  function refreshNow(btn){
    if(S.edit||S.busy){alert("Finisci prima la modifica in corso.");return}
    btn.classList.add("spin");
    fetchFresh().then(function(f){
      if(S.file&&f.data.ct===S.file.data.ct)return "ok";
      return readData(f,S.dk).then(function(d){S.file=f;setBase(d);return "ok"});
    }).catch(function(){return "err"}).then(function(x){btn.classList.remove("spin");btn.classList.add(x==="ok"?"done":"bad");setTimeout(function(){btn.classList.remove("done","bad")},1500)});
  }
  function poll(){
    if(!S.role||S.edit||S.busy||document.hidden)return;
    if(S.lastSave&&Date.now()-S.lastSave<180000)return;
    fetchFile().then(function(f){
      if(S.file&&f.data.ct===S.file.data.ct)return;
      return readData(f,S.dk).then(function(d){S.file=f;if(!S.edit)setBase(d)});
    }).catch(function(){});
  }
  setInterval(poll,45000);document.addEventListener("visibilitychange",function(){if(!document.hidden)poll()});

  function renderGate(){
    $("bar").innerHTML="";$("tabs").innerHTML="";
    var m=$("main");
    m.innerHTML='<div class="d panel form"><h2>Entra</h2><p class="sub">Scrivi la password per vedere il ricettario.</p>'+
      '<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="none">'+
      (S.formErr?'<div class="err">'+esc(S.formErr)+'</div>':'')+(S.msg?'<div class="okmsg">'+esc(S.msg)+'</div>':'')+
      '<div class="actions"><button class="btn pri" data-ui="login">Entra</button></div></div>';
  }
  function renderBar(){
    var b=$("bar");if(!b)return;
    var rf='<button class="rf" data-ui="refresh" aria-label="Aggiorna">&#8635;</button>';
    if(S.role==="boss"&&S.canEdit)b.innerHTML='<button class="btn pri" data-ui="nuova">+ Nuova ricetta</button><a class="btn" href="#impostazioni" style="text-decoration:none">Impostazioni</a>'+rf+'<button class="lo" data-ui="logout">esci</button>';
    else if(S.role==="boss")b.innerHTML='<span class="st">Da collegare</span><a class="btn pri" href="#impostazioni" style="text-decoration:none">Impostazioni</a>'+rf+'<button class="lo" data-ui="logout">esci</button>';
    else if(S.role==="staff")b.innerHTML='<span class="st">Sola lettura</span>'+rf+'<button class="lo" data-ui="logout">esci</button>';
    else b.innerHTML="";
  }
  function renderPanel(){
    if(S.panel==="bicchieri"){
      var back='<button class="back" data-back="1"><b>←</b> Indietro</button>';
      if(S.role!=="boss")return '<div class="d panel">'+back+'<h2>Bicchieri</h2><p>Solo il capo può cambiare i bicchieri.</p></div>';
      var gm=(S.formErr?'<div class="err">'+esc(S.formErr)+'</div>':'')+(S.msg?'<div class="okmsg">'+esc(S.msg)+'</div>':'');
      var gl2=(S.bicchieri||[]).slice().sort(byName);
      return '<div class="d panel form">'+back+'<h2>Bicchieri</h2>'+gm+
        (S.db?'':'<p>Prima salva il collegamento a GitHub da Impostazioni.</p>')+
        gl2.map(function(g){var used=(S.ricette||[]).filter(function(x){return x.bicchiere===g.id}).length;
          return '<div class="issue"><label for="gn-'+esc(g.id)+'">Nome</label><input id="gn-'+esc(g.id)+'" value="'+esc(g.nome)+'">'+
            '<label for="gc-'+esc(g.id)+'">Capienza (ml)</label><input id="gc-'+esc(g.id)+'" type="number" min="0" step="any" inputmode="decimal" value="'+(g.capienza?esc(g.capienza):"")+'">'+
            '<p class="src" style="margin:6px 0 0">Usato in '+used+' ricette</p>'+
            '<div class="ia"><button class="btn pri" data-ui="gsave" data-id="'+esc(g.id)+'">Salva</button><button class="btn danger" data-ui="gdel" data-id="'+esc(g.id)+'">Elimina</button></div></div>'}).join("")+
        '<h3>Nuovo bicchiere</h3><label for="gnew-n">Nome</label><input id="gnew-n"><label for="gnew-c">Capienza (ml)</label><input id="gnew-c" type="number" min="0" step="any" inputmode="decimal">'+
        '<div class="actions"><button class="btn pri" data-ui="gadd">Aggiungi bicchiere</button></div></div>';
    }
    if(S.panel==="ordine"){
      var bko='<button class="back" data-back="1"><b>←</b> Indietro</button>';
      if(S.role!=="boss")return '<div class="d panel">'+bko+'<h2>Ordine dei menu</h2><p>Solo il capo può cambiare l\'ordine dei menu.</p></div>';
      var om=(S.formErr?'<div class="err">'+esc(S.formErr)+'</div>':'')+(S.msg?'<div class="okmsg">'+esc(S.msg)+'</div>':'');
      var ord=S.ord||orderIds(),nm={};TABS.forEach(function(t){nm[t[0]]=t[1]});
      return '<div class="d panel form">'+bko+'<h2>Ordine dei menu</h2>'+om+
        '<p>Sposta ogni voce in su o in giù, poi premi «Salva ordine». Vale per tutti.</p>'+
        (S.db?'':'<p>Prima salva il collegamento a GitHub da Impostazioni.</p>')+
        ord.map(function(id,i){return '<div class="issue"><p style="margin:0 0 6px"><b>'+(i+1)+'.</b> '+esc(nm[id])+'</p><div class="ia">'+
          '<button class="btn" data-ui="osu" data-i="'+i+'" aria-label="Sposta '+esc(nm[id])+' in su"'+(i===0?' disabled':'')+'>Su</button>'+
          '<button class="btn" data-ui="ogiu" data-i="'+i+'" aria-label="Sposta '+esc(nm[id])+' in giù"'+(i===ord.length-1?' disabled':'')+'>Giù</button></div></div>'}).join("")+
        '<div class="actions"><button class="btn pri" data-ui="osalva">Salva ordine</button><button class="btn" data-ui="oreset">Ripristina ordine originale</button></div></div>';
    }
    if(S.panel==="impostazioni"){
      if(S.role!=="boss")return '<div class="d panel"><button class="back" data-back="1"><b>←</b> Indietro</button><h2>Impostazioni</h2><p>Solo il capo può cambiare le impostazioni.</p></div>';
      var n=(S.ricette||[]).length,msgs=(S.formErr?'<div class="err">'+esc(S.formErr)+'</div>':'')+(S.msg?'<div class="okmsg">'+esc(S.msg)+'</div>':'');
      return '<div class="d panel form"><button class="back" data-back="1"><b>←</b> Indietro</button><h2>Impostazioni</h2>'+msgs+
        '<h3>Bicchieri</h3><p>Elenco dei bicchieri con la capienza ('+(S.bicchieri||[]).length+').</p><div class="actions"><a class="btn" href="#bicchieri" style="text-decoration:none">Gestisci bicchieri</a></div>'+
        '<h3>Ordine dei menu</h3><p>Decidi in che ordine appaiono i menu in alto.</p><div class="actions"><a class="btn" href="#ordine" style="text-decoration:none">Cambia ordine dei menu</a></div>'+
        '<h3>Collegamento a GitHub</h3><p>'+(S.tok?'Attivo: puoi modificare le ricette dall\'app.':'Manca. Serve una sola volta per poter salvare le modifiche.')+'</p>'+
        '<label for="tk">Token GitHub</label><input id="tk" type="password" autocomplete="off" autocapitalize="none">'+
        '<label for="tkpw">Password capo (per proteggere il token)</label><input id="tkpw" type="password" autocomplete="current-password" autocapitalize="none">'+
        '<div class="actions"><button class="btn pri" data-ui="savetok">Salva collegamento</button></div>'+
        '<h3>Password capo</h3><label for="pb1">Nuova password (almeno 6 caratteri)</label><input id="pb1" type="password" autocomplete="new-password" autocapitalize="none">'+
        '<label for="pb2">Ripeti la nuova password</label><input id="pb2" type="password" autocomplete="new-password" autocapitalize="none">'+
        '<div class="actions"><button class="btn pri" data-ui="chboss">Cambia password capo</button></div>'+
        '<h3>Password dipendenti</h3><label for="ps1">Nuova password (almeno 4 caratteri)</label><input id="ps1" type="text" autocomplete="off" autocapitalize="none">'+
        '<div class="actions"><button class="btn pri" data-ui="chstaff">Cambia password dipendenti</button></div>'+
        '<h3>Elenco drink da compilare</h3><p>Scarica un file di testo con tutti i cocktail: per ognuno scrivi bicchiere, ghiaccio, tecnica e decorazione, poi lo mandi a Claude.</p><div class="actions"><button class="btn" data-ui="elenco">Scarica elenco drink</button></div>'+
        '<h3>PDF</h3><p>Scarica il ricettario in PDF per stamparlo o condividerlo. Scegli cosa includere: si apre la finestra di stampa, dove scegli «Salva come PDF».</p><label for="pdfsel">Cosa scaricare</label><select id="pdfsel"><option value="tutto">Tutto il ricettario</option>'+["cocktail","analcolico","homemade","blend","soda","infusione"].map(function(c){return '<option value="'+c+'">'+esc(CATNAME[c])+'</option>'}).join("")+'</select><div class="actions"><button class="btn" data-ui="pdf">Scarica PDF</button></div>'+
        '<h3>Backup</h3><p>Scarica un file con tutte le ricette, le lezioni e gli appunti ('+n+' ricette).</p>'+
        '<div class="actions"><button class="btn" data-ui="backup">Scarica backup</button></div></div>';
    }
    return "";
  }
  function flash(msg,err){S.msg=err?"":msg;S.formErr=err?msg:"";render()}
  function doLogin(){
    var pw=($("pw")||{}).value||"";if(!pw){flash("Scrivi la password.",1);return}
    S.busy=true;flash("Controllo…");
    (S.file?Promise.resolve(S.file):fetchFile().then(function(f){S.file=f;return f})).then(function(f){
      return unlock(f,pw).then(function(r){
        S.role=r.role;S.dkRaw=r.raw;S.tok=r.tok;
        return dkKey(r.raw).then(function(k){S.dk=k;return readData(f,k)}).then(function(d){S.busy=false;S.formErr="";S.msg="";sessSave();S.panel=null;afterAuth(d);go(S.tab)});
      });
    }).catch(function(e){S.busy=false;S.role=null;flash(e&&e.message==="bad"?"Password sbagliata.":"Non riesco a leggere il ricettario. Controlla la connessione.",1)});
  }
  function doLogout(){sessClear();S.role=null;S.dk=null;S.dkRaw=null;S.tok=null;S.canEdit=false;S.db=null;S.edit=false;S.panel=null;S.open=null;S.ricette=S.lezioni=S.menu=S.appunti=S.bicchieri=S.impostazioni=null;S.msg="";S.formErr="";render()}
  function doSaveTok(){
    var tk=($("tk")||{}).value.trim(),pw=($("tkpw")||{}).value||"";
    if(!tk||!pw){flash("Compila token e password capo.",1);return}
    S.busy=true;flash("Controllo…");
    tryRole(S.file,pw,"boss").then(function(r){
      var old=S.tok;S.tok=tk;
      return aesEnc(r.k,enc8.encode(tk)).then(function(t){
        return commit(function(file){var f=Object.assign({},file);f.tok=t;return Promise.resolve(f)},"Collegamento GitHub dal sito").then(function(nf){S.file=nf;S.lastSave=Date.now();S.busy=false;S.canEdit=true;S.db=makeDb();sessSave();flash("Collegamento attivo. Ora puoi modificare le ricette.")});
      }).catch(function(e){S.tok=old;throw e});
    }).catch(function(e){S.busy=false;flash(e&&e.status?saveMsg(e):"Password capo sbagliata.",1)});
  }
  function doChBoss(){
    var p1=$("pb1").value,p2=$("pb2").value;
    if(p1.length<6){flash("La nuova password deve avere almeno 6 caratteri.",1);return}
    if(p1!==p2){flash("Le due password non coincidono.",1);return}
    if(!S.tok){flash("Prima salva il collegamento a GitHub.",1);return}
    S.busy=true;flash("Salvo…");
    rewrap(p1,S.dkRaw).then(function(r){return aesEnc(r.k,enc8.encode(S.tok)).then(function(t){
      return commit(function(file){var f=Object.assign({},file);f.boss=r.w;f.tok=t;return Promise.resolve(f)},"Password capo cambiata")});
    }).then(function(nf){S.file=nf;S.lastSave=Date.now();S.busy=false;flash("Password capo cambiata.")},function(e){S.busy=false;flash(saveMsg(e),1)});
  }
  function doChStaff(){
    var p=$("ps1").value.trim();
    if(p.length<4){flash("La password deve avere almeno 4 caratteri.",1);return}
    if(!S.tok){flash("Prima salva il collegamento a GitHub.",1);return}
    S.busy=true;flash("Salvo…");
    rewrap(p,S.dkRaw).then(function(r){return commit(function(file){var f=Object.assign({},file);f.staff=r.w;return Promise.resolve(f)},"Password dipendenti cambiata")}).then(function(nf){S.file=nf;S.lastSave=Date.now();S.busy=false;flash("Password dipendenti cambiata. Comunicala ai dipendenti.")},function(e){S.busy=false;flash(saveMsg(e),1)});
  }
  function glassWrite(id,d,msg){
    if(!S.db){flash("Prima salva il collegamento a GitHub da Impostazioni.",1);return}
    var dc=S.db.doc("bicchieri/"+id);
    S.busy=true;
    (d===null?dc.delete():dc.set(d)).then(function(){S.busy=false;flash(msg)},function(e){S.busy=false;flash(saveMsg(e),1)});
  }
  function glassData(n,c){var nome=(n||"").trim();if(!nome)return null;var cap=parseFloat(String(c||"").replace(",","."));var d={nome:nome};if(cap>0)d.capienza=cap;return d}
  function doBackup(){
    var out={ricette:{},lezioni:{},menu:{},appunti:{},bicchieri:{},serate:{},impostazioni:{}};
    COLS.forEach(function(c){(S[c]||[]).forEach(function(r){var o=Object.assign({},r);delete o.id;out[c][r.id]=o})});
    var blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ricettario-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
    flash("Backup scaricato.");
  }
  function doPdf(){
    var sel=($("pdfsel")||{}).value||"tutto",ORD=["cocktail","analcolico","homemade","blend","soda","infusione"],cats=sel==="tutto"?ORD:[sel],keep=S.unit,h="";
    S.unit="ml";
    cats.forEach(function(c){
      var L=(S.ricette||[]).filter(function(r){return r.cat===c&&!inc(r)}).sort(byName);if(!L.length)return;
      h+='<section><h1>'+esc(CATNAME[c])+'</h1><div class="pcols">'+L.map(function(r){
        var g=glassOf(r),tc=(r.tecnica||"")+(r.tecnica&&r.tecnica_nota?" · ":"")+(r.tecnica_nota||"");
        var meta=[g?"Bicchiere: "+glassLabel(g):"",r.ghiaccio?"Ghiaccio: "+r.ghiaccio:"",tc?"Tecnica: "+tc:"",r.guarn?"Decorazione: "+r.guarn:""].filter(Boolean);
        return '<article><h2>'+esc(dn(r))+'</h2><ul>'+(r.ing||[]).map(function(t){var x=split(t,1);return '<li><span>'+esc(x.q)+'</span> '+esc(x.t)+'</li>'}).join("")+'</ul>'+
          (meta.length?'<p class="pm">'+meta.map(esc).join('<br>')+'</p>':'')+(r.metodo?'<p>Metodo: '+esc(r.metodo)+'</p>':'')+(r.proc?'<p>'+esc(r.proc)+'</p>':'')+(r.note?'<p class="pn">Note: '+esc(r.note)+'</p>':'')+'</article>';
      }).join("")+'</div></section>';
    });
    S.unit=keep;
    if(!h){flash("Non c'è niente da stampare in questa sezione.",1);return}
    var old=$("printroot");if(old)old.remove();
    var root=document.createElement("div");root.id="printroot";root.innerHTML=h;document.body.appendChild(root);
    var done=function(){window.removeEventListener("afterprint",done);var r0=$("printroot");if(r0)r0.remove()};
    window.addEventListener("afterprint",done);
    setTimeout(function(){window.print()},250);
  }
  function doElenco(){
    var L=["ELENCO DRINK - compila dopo i due punti, lascia vuoto ciò che non sai","Tecniche: S shake, SD shake double strain, SS stir and strain, B build, BL blend, FB flash blend, T throwing",""];
    var cs=(S.ricette||[]).filter(function(r){return r.cat==="cocktail"||r.cat==="analcolico"}).sort(byName);
    cs.forEach(function(r){var g=glassOf(r);
      L.push("## "+dn(r));
      L.push("Ingredienti: "+(r.ing||[]).join("; "));
      L.push("Bicchiere: "+(g?g.nome:""));
      L.push("Ghiaccio: "+(r.ghiaccio||""));
      L.push("Tecnica: "+(r.tecnica||""));
      L.push("Decorazione: "+(r.guarn||""));
      L.push("")});
    var blob=new Blob([L.join("\n")],{type:"text/plain;charset=utf-8"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="elenco-drink-"+new Date().toISOString().slice(0,10)+".txt";
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
    flash("Elenco scaricato ("+cs.length+" drink).");
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("[data-ui]");if(!b)return;
    var a=b.getAttribute("data-ui");
    if(a==="login")doLogin();
    else if(a==="refresh")refreshNow(b);
    else if(a==="logout"){if(confirm("Uscire dall'account?"))doLogout()}
    else if(a==="savetok")doSaveTok();
    else if(a==="chboss")doChBoss();
    else if(a==="chstaff")doChStaff();
    else if(a==="backup")doBackup();
    else if(a==="osu"||a==="ogiu"){var oi2=parseInt(b.getAttribute("data-i"),10),oj=a==="osu"?oi2-1:oi2+1;S.ord=S.ord||orderIds();if(oj>=0&&oj<S.ord.length){var ot=S.ord[oi2];S.ord[oi2]=S.ord[oj];S.ord[oj]=ot}S.msg="";S.formErr="";render()}
    else if(a==="osalva"){if(!S.db){flash("Prima salva il collegamento a GitHub da Impostazioni.",1);return}S.busy=true;S.db.doc("impostazioni/ordine").set({lista:S.ord||orderIds()}).then(function(){S.busy=false;flash("Ordine salvato.")},function(e){S.busy=false;flash(saveMsg(e),1)})}
    else if(a==="oreset"){S.ord=TABS.map(function(t){return t[0]});S.msg="";S.formErr="";render()}
    else if(a==="elenco")doElenco();
    else if(a==="pdf")doPdf();
    else if(a==="gsave"){var gi=b.getAttribute("data-id"),gd1=glassData(($("gn-"+gi)||{}).value,($("gc-"+gi)||{}).value);if(!gd1){flash("Il nome non può essere vuoto.",1);return}glassWrite(gi,gd1,"Bicchiere salvato.")}
    else if(a==="gdel"){var gi2=b.getAttribute("data-id"),us=(S.ricette||[]).filter(function(x){return x.bicchiere===gi2}).length;
      if(us){flash("Questo bicchiere è usato in "+us+" ricette: cambialo prima in quelle ricette.",1);return}
      if(confirm("Eliminare il bicchiere?"))glassWrite(gi2,null,"Bicchiere eliminato.")}
    else if(a==="gadd"){var gd2=glassData(($("gnew-n")||{}).value,($("gnew-c")||{}).value);if(!gd2){flash("Scrivi il nome del bicchiere.",1);return}
      var gi3=slug(gd2.nome),k=2,base=gi3;while((S.bicchieri||[]).some(function(g){return g.id===gi3})){gi3=base+"-"+k;k++}
      glassWrite(gi3,gd2,"Bicchiere aggiunto.")}
    else if(a==="nuova"){
      var cat=CATNAME[S.tab]?S.tab:"cocktail";
      reset();S.open=null;S.creating=true;S.edit=true;S.formErr="";
      $("main").innerHTML=formRecipe({cat:cat});window.scrollTo(0,0);
    }
  });
  document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="pw")doLogin()});

  readHash();render();
  if(!window.crypto||!crypto.subtle){S.formErr="Questo browser non è abbastanza recente per aprire il ricettario.";render()}
  else fetchFile().then(function(f){
    S.file=f;
    var sess=null;try{sess=JSON.parse(localStorage.getItem(SESS)||"null")}catch(x){}
    if(!sess||!sess.dk)return;
    var raw=b64d(sess.dk);
    return dkKey(raw).then(function(k){return readData(f,k).then(function(d){S.role=sess.role;S.dk=k;S.dkRaw=raw;S.tok=sess.tok||null;afterAuth(d)})}).catch(function(){sessClear()});
  }).catch(function(){S.formErr="Non riesco a leggere il ricettario. Controlla la connessione e riprova.";render()});
})();
