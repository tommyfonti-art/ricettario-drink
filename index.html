<style>
html{color-scheme:light}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.bar .btn{padding:6px 12px;font-size:.88rem}
.bar .st{font-size:.8rem;color:var(--muted)}
.bar .st.on{color:var(--ok)}
.bar .st.off{color:var(--accent);font-weight:600;flex-basis:100%}
body.locked .search,body.locked .tabs{display:none}
.panel{max-width:420px}
.panel h2{font-family:var(--f-display);font-size:1.5rem;margin:0 0 8px}
.panel .form input,.panel .form select{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.form select{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.okmsg{color:var(--ok);margin-top:10px}
.idl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:12px 0 0;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.idl span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.idl b{font-weight:500;overflow-wrap:anywhere}.idl b.no{font-weight:400;font-style:italic;color:var(--muted)}
@media (min-width:600px){.idl{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* Layout: un quaderno da bancone. Barra sezioni fissa in alto, elenco a righe raggruppate, scheda ricetta con dosi in monospazio, moltiplicatore, unità ml/oz e modifica a richiesta. */
:root{
  --bg:#F4F1EA; --surface:#FFFDF8; --fg:#1C2420; --muted:#5F6B64; --line:#DDD8CC;
  --accent:#1F5C46; --accent-soft:#DCEAE2; --accent-fg:#FFFFFF; --ok:#1F5C46; --tag:#E7E3D8;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{padding-block:20px 12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.search{margin-top:14px}
.search input{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.search input:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:12px 10px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs .n{font-family:var(--f-mono);font-size:.72rem;margin-left:5px;color:var(--muted)}
main{padding-top:18px;min-width:0}
h2.grp{font-family:var(--f-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500;margin:26px 0 6px;display:flex;gap:10px;align-items:center}
h2.grp:first-child{margin-top:4px}
h2.grp::after{content:"";flex:1;border-top:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;font:inherit;color:inherit;cursor:pointer;text-decoration:none}
.row:hover .rn{color:var(--accent)}
.row .rn{font-weight:500;flex:1;min-width:0;overflow-wrap:anywhere}
.row .rs{color:var(--muted);font-size:.82rem;font-weight:400}
.chip{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:99px;background:var(--tag);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap;font-weight:400}
.chip.hot{background:var(--accent-soft);color:var(--accent)}
.back{font:inherit;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:99px;padding:6px 14px 6px 10px;cursor:pointer;font-weight:600;font-size:.85rem;margin-bottom:12px}
.back b{font-size:1.15rem;line-height:1;font-weight:500;margin-top:-2px}
.rf{margin-left:auto;font:inherit;font-size:1.3rem;line-height:1;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;padding:0}
.rf.spin{animation:sp .8s linear infinite}.rf.done{color:var(--ok)}.rf.bad{color:var(--accent)}
@keyframes sp{to{transform:rotate(360deg)}}
.lo{font:inherit;font-size:.7rem;background:none;border:0;color:var(--muted);opacity:.55;padding:6px 4px;margin-left:14px;cursor:pointer;text-decoration:underline}
.d h2{font-family:var(--f-display);font-size:1.7rem;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 0}
.ctl .lab{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px;min-width:5.4rem}
.ctl button{font:inherit;font-family:var(--f-mono);font-size:.85rem;padding:5px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ctl input{width:70px;font:inherit;font-family:var(--f-mono);font-size:.85rem;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.ing{list-style:none;margin:16px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.ing li{display:flex;gap:12px;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--line)}
.ing li:last-child{border-bottom:0}
.ing .q{font-family:var(--f-mono);font-size:.88rem;min-width:5.6rem;flex:none;font-variant-numeric:tabular-nums}
.ing .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ing a{color:var(--accent)}
h3{font-family:var(--f-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500;margin:24px 0 6px}
.d p{margin:0 0 10px;max-width:65ch}
.dupg{margin:0 0 12px}.dupt{font-weight:600;font-size:.9rem;margin:8px 0 2px}
.btn[disabled]{opacity:.35}
.uncmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.uncol{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:.88rem;min-width:0;overflow-wrap:anywhere}.uncol ul{margin:4px 0;padding-left:16px}.uncol li{margin:2px 0}.uncol h4{margin:8px 0 2px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}@media (max-width:340px){.uncmp{grid-template-columns:1fr}}
.issue{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin:0 0 10px}.issue .ih{margin-bottom:4px}.issue .it{font-size:.88rem;color:var(--fg);max-width:65ch}.issue .mrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;padding:6px 0;border-top:1px solid var(--line)}.issue .mrow .btn{padding:4px 10px;font-size:.85rem}.issue .ia{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ctl select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;max-width:100%}
.ctl.one{gap:5px}.ctl.one button{padding:5px 7px}.ctl.one input.tot{width:122px;font-family:inherit;font-size:.82rem}
.note{border-left:3px solid var(--accent);padding:6px 12px;background:var(--accent-soft);border-radius:0 6px 6px 0;max-width:65ch}
ul.pts{margin:0;padding-left:18px;max-width:65ch}
ul.pts li{margin-bottom:6px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
.actions{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.danger.sure{background:var(--accent);color:var(--accent-fg)}
.empty{padding:32px 4px;color:var(--muted);max-width:52ch}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:1.15rem;margin-bottom:4px}
.lezcard{display:block;text-align:left;width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;cursor:pointer;text-decoration:none}
.lezcard:hover{border-color:var(--accent)}
.lezcard strong{font-family:var(--f-display);font-size:1.15rem;display:block;margin-bottom:2px}
.lezcard span{color:var(--muted);font-size:.88rem}
.src{color:var(--muted);font-size:.8rem;margin-top:26px}
.form label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 4px}
.form input,.form textarea{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.form textarea{font-family:var(--f-mono);font-size:.88rem;line-height:1.5;resize:vertical}
.form .hint{color:var(--muted);font-size:.8rem;margin:4px 0 0}
.err{color:var(--accent);margin-top:10px}
@media (prefers-reduced-motion:no-preference){.d,.list{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
#printroot{display:none}
@media print{
html,body{background:#fff!important;color:#000!important}
body>*:not(#printroot){display:none!important}
#printroot{display:block;color:#000;background:#fff;font:10pt/1.35 var(--f-body)}
@page{margin:14mm}
#printroot section{break-after:page}
#printroot section:last-child{break-after:auto}
#printroot h1{font-family:var(--f-display);font-size:20pt;margin:0 0 6mm;padding-bottom:2mm;border-bottom:1.5pt solid #000}
#printroot .pcols{column-count:2;column-gap:10mm}
#printroot article{break-inside:avoid;margin:0 0 5mm}
#printroot h2{font-family:var(--f-display);font-size:11.5pt;margin:0 0 1mm}
#printroot ul{list-style:none;margin:0;padding:0}
#printroot li span{font-family:var(--f-mono);display:inline-block;min-width:17mm}
#printroot p{margin:1.5mm 0 0;font-size:9.5pt}
#printroot .pm{color:#333}
#printroot .pn{font-style:italic;color:#333}
}
</style>
