<head>

<style>
html{color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.bar .btn{padding:6px 12px;font-size:.88rem}
.bar .st{font-size:.8rem;color:var(--muted)}
.bar .st.on{color:var(--ok)}
body.locked .search,body.locked .tabs{display:none}
.panel{max-width:420px}
.panel h2{font-family:var(--f-display);font-size:1.5rem;margin:0 0 8px}
.panel .form input,.panel .form select{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.form select{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.okmsg{color:var(--ok);margin-top:10px}
/* Layout: un quaderno da bancone. Barra sezioni fissa in alto, elenco a righe raggruppate, scheda ricetta con dosi in monospazio, moltiplicatore, unità ml/oz e modifica a richiesta. */
:root{
  --bg:#F3F1F6; --surface:#FFFFFF; --fg:#1D1A24; --muted:#6A6478; --line:#DDD8E5;
  --accent:#B5301C; --accent-soft:#F6DFDA; --accent-fg:#FFFFFF; --ok:#2C6B57; --tag:#E9E5F0;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16141B; --surface:#1F1C27; --fg:#ECE8F2; --muted:#A39CB3; --line:#332F40;
  --accent:#F0674F; --accent-soft:#3A2420; --accent-fg:#1A0F0D; --ok:#6FCBAE; --tag:#2B2735; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16141B; --surface:#1F1C27; --fg:#ECE8F2; --muted:#A39CB3; --line:#332F40;
  --accent:#F0674F; --accent-soft:#3A2420; --accent-fg:#1A0F0D; --ok:#6FCBAE; --tag:#2B2735; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{padding-block:20px 12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.search{margin-top:14px}
.search input{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.search input:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:12px 10px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs .n{font-family:var(--f-mono);font-size:.72rem;margin-left:5px;color:var(--muted)}
main{padding-top:18px;min-width:0}
h2.grp{font-family:var(--f-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500;margin:26px 0 6px;display:flex;gap:10px;align-items:center}
h2.grp:first-child{margin-top:4px}
h2.grp::after{content:"";flex:1;border-top:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;font:inherit;color:inherit;cursor:pointer;text-decoration:none}
.row:hover .rn{color:var(--accent)}
.row .rn{font-weight:500;flex:1;min-width:0;overflow-wrap:anywhere}
.row .rs{color:var(--muted);font-size:.82rem;font-weight:400}
.chip{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:99px;background:var(--tag);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap;font-weight:400}
.chip.hot{background:var(--accent-soft);color:var(--accent)}
.back{font:inherit;background:none;border:0;color:var(--accent);padding:0;cursor:pointer;font-weight:500;margin-bottom:12px}
.d h2{font-family:var(--f-display);font-size:1.7rem;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 0}
.ctl .lab{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px;min-width:5.4rem}
.ctl button{font:inherit;font-family:var(--f-mono);font-size:.85rem;padding:5px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ctl input{width:70px;font:inherit;font-family:var(--f-mono);font-size:.85rem;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.ing{list-style:none;margin:16px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.ing li{display:flex;gap:12px;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--line)}
.ing li:last-child{border-bottom:0}
.ing .q{font-family:var(--f-mono);font-size:.88rem;min-width:5.6rem;flex:none;font-variant-numeric:tabular-nums}
.ing .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ing a{color:var(--accent)}
h3{font-family:var(--f-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500;margin:24px 0 6px}
.d p{margin:0 0 10px;max-width:65ch}
.dupg{margin:0 0 12px}.dupt{font-weight:600;font-size:.9rem;margin:8px 0 2px}
.issue{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin:0 0 10px}.issue .ih{margin-bottom:4px}.issue .it{font-size:.88rem;color:var(--fg);max-width:65ch}.issue .mrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;padding:6px 0;border-top:1px solid var(--line)}.issue .mrow .btn{padding:4px 10px;font-size:.85rem}.issue .ia{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ctl.one{gap:5px}.ctl.one button{padding:5px 7px}.ctl.one input.tot{width:122px;font-family:inherit;font-size:.82rem}
.note{border-left:3px solid var(--accent);padding:6px 12px;background:var(--accent-soft);border-radius:0 6px 6px 0;max-width:65ch}
ul.pts{margin:0;padding-left:18px;max-width:65ch}
ul.pts li{margin-bottom:6px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
.actions{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.danger.sure{background:var(--accent);color:var(--accent-fg)}
.empty{padding:32px 4px;color:var(--muted);max-width:52ch}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:1.15rem;margin-bottom:4px}
.lezcard{display:block;text-align:left;width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;cursor:pointer;text-decoration:none}
.lezcard:hover{border-color:var(--accent)}
.lezcard strong{font-family:var(--f-display);font-size:1.15rem;display:block;margin-bottom:2px}
.lezcard span{color:var(--muted);font-size:.88rem}
.src{color:var(--muted);font-size:.8rem;margin-top:26px}
.form label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 4px}
.form input,.form textarea{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.form textarea{font-family:var(--f-mono);font-size:.88rem;line-height:1.5;resize:vertical}
.form .hint{color:var(--muted);font-size:.8rem;margin:4px 0 0}
.err{color:var(--accent);margin-top:10px}
@media (prefers-reduced-motion:no-preference){.d,.list{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Ricettario Repub</h1>
    <p class="sub">Cocktail, homemade, infusioni, blend, menu e lezioni.</p>
    <div class="bar" id="bar"></div>
    <div class="search"><input id="q" type="search" placeholder="Cerca una ricetta, un ingrediente, una tecnica" autocomplete="off" aria-label="Cerca"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
  <main id="main"><div class="empty"><b>Sto caricando il ricettario</b>Le ricette compaiono qui appena sono pronte.</div></main>
</div>

<script>
(function(){
  var TABS=[["cocktail","Cocktail"],["homemade","Homemade"],["blend","Blend"],["soda","Soda"],["infusione","Liquori e infusi"],["menu","Menu"],["lezioni","Lezioni e corsi"],["appunti","Appunti e idee"],["controllare","Da controllare"]];
  var ORDER={
    cocktail:["Pub","Mocktail","Tiki","Milk washing"],
    homemade:["Sciroppi e preparazioni","Soda","Acidificati e cordial","Shrub e aceti","Foam","Chiarificati","Milk washing"],
    infusione:["Infusi","Liquori","Tinture"],
    blend:["Blend rum","Blend","Botte"]};
  var CATNAME={cocktail:"Cocktail",homemade:"Homemade",soda:"Soda",infusione:"Liquori e infusi",blend:"Blend"};
  var OZ=30; /* 1 oz = 30 ml, misura da bar */
  var FONTI=["Drink list Manga 2026 (Villain edition)","Drink list Manga 2024/25","Drink list 2023/24","Capodanno","Drink list 2023","Drink list 2022-23","Drink list mare 2022","Cocktail list mare 2021","Menù inverno 2020-21","Tiki night","Tiki list mare 2018","Altre ricette","Lezione Chiarificazione"];
  var EDIT_EMAIL="modifica@ricettario-repub.app";
  var S={role:null,busy:false,panel:null,creating:false,msg:"",authReady:false,issues:null,delId:null,dup:{},dupg:[],target:null,ricette:null,lezioni:null,menu:null,appunti:null,tab:"cocktail",q:"",open:null,scale:1,unit:"ml",err:null,db:null,canEdit:false,edit:false,confirmDel:false,formErr:""};
  try{var u0=localStorage.getItem("ricettario-unit");if(u0==="oz"||u0==="ml")S.unit=u0}catch(e){}
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()}
  function byName(a,b){return a.nome.localeCompare(b.nome,"it")}
  function inc(r){return r.stato==="incompleta"}

  /* ---- ingredienti: scala il numero iniziale e converte ml, cl, oz ---- */
  var NUM=/^(\d+(?:[.,]\d+)?(?:\s+\d\/\d)?|\d\/\d)(?!\d|%|\/)\s*(.*)$/;
  var UNIT=/^(ml|cl|oz|gr|g|kg|l|litri|litro|drop|dash|dr|dh|bs|parti|parte|cucchiaino|cucchiaio|cucchiai|tsp|tbsp)\b\s*(.*)$/i;
  function toNum(s){s=s.trim();var m=s.match(/^(\d+)\s+(\d)\/(\d)$/);if(m)return +m[1]+ +m[2]/+m[3];m=s.match(/^(\d)\/(\d)$/);if(m)return +m[1]/+m[2];return parseFloat(s.replace(",","."))}
  function fmt(n){var r=Math.round(n*100)/100;return String(r).replace(".",",")}
  function fmtOz(n){var q=Math.round(n*4)/4;if(q===0&&n>0)q=0.25;var w=Math.floor(q),f=q-w;var fr=f===0.25?"1/4":f===0.5?"1/2":f===0.75?"3/4":"";return ((w?String(w):"")+(w&&fr?" ":"")+fr)||"0"}
  var RNG=/^(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)\s+(.*)$/;
  function conv(num,k,u){
    var val=num*k,uu=u;
    if(S.unit==="oz"){if(u==="ml"){val/=OZ;uu="oz"}else if(u==="cl"){val/=OZ/10;uu="oz"}}
    else{if(u==="cl"){val*=10;uu="ml"}else if(u==="oz"){val*=OZ;uu="ml"}}
    return {s:(S.unit==="oz"&&uu==="oz")?fmtOz(val):fmt(val),u:uu};
  }
  function split(text,k){
    var rg=text.match(RNG);
    if(rg){
      var ru=rg[3].match(UNIT),u1=ru?ru[1].toLowerCase():"",a=conv(toNum(rg[1]),k,u1),b=conv(toNum(rg[2]),k,u1);
      return {q:a.s+"-"+b.s+(ru?" "+a.u:""),t:ru?ru[2]:rg[3]};
    }
    var m=text.match(NUM);
    if(!m)return {q:"",t:text};
    var unit=m[2].match(UNIT),num=toNum(m[1]);
    if(isNaN(num))return {q:"",t:text};
    var c=conv(num,k,unit?unit[1].toLowerCase():"");
    return {q:c.s+(unit?" "+c.u:""),t:unit?unit[2]:m[2]};
  }
  /* ---- quantità totale di una ricetta, in ml (gr contati come ml) ---- */
  function toMl(v,u){switch(u){case"ml":case"gr":case"g":return v;case"cl":return v*10;case"oz":return v*OZ;case"kg":case"l":case"litri":case"litro":return v*1000;default:return null}}
  function mlOf(text){
    var rg=text.match(RNG);
    if(rg){var ru=rg[3].match(UNIT);if(!ru)return null;return toMl((toNum(rg[1])+toNum(rg[2]))/2,ru[1].toLowerCase())}
    var m=text.match(NUM);if(!m)return null;var un=m[2].match(UNIT);if(!un)return null;
    var v=toNum(m[1]);return isNaN(v)?null:toMl(v,un[1].toLowerCase());
  }
  function baseMl(r){var t=0,skip=0;(r.ing||[]).forEach(function(x){var v=mlOf(x);if(v==null)skip++;else t+=v});return {t:t,skip:skip}}

  /* ---- cose da controllare ---- */
  function okHas(r,k){return (r.ok||[]).indexOf(k)>=0}
  var COUNTABLE=/^(foglie|foglia|fette|fetta|cubett|gocce|goccia|spicchi|spicchio|chiodi|baccell|sfere|sfera|noccioli|olive|ciliegi|limoni|lime\b.*(interi|intero)|uova|uovo|bustin|stecche|stecca|fave|fava)/i;
  function numIssues(r){
    var out=[],isC=r.cat==="cocktail";
    (r.ing||[]).forEach(function(x){
      var rg=x.match(RNG);
      if(rg){if(toNum(rg[1])>toNum(rg[2]))out.push("«"+x+"»: intervallo al contrario");return}
      var m=x.match(NUM);if(!m)return;
      var n=toNum(m[1]);if(isNaN(n))return;
      var un=m[2].match(UNIT);
      var fr=m[1].match(/(\d)\/(\d)$/);
      if(fr&&[2,3,4,8].indexOf(+fr[2])<0)out.push("«"+x+"»: frazione insolita");
      if(!un&&n>=10&&!COUNTABLE.test(m[2]))out.push("«"+x+"»: quantità senza unità di misura");
      if(isC&&un){var ml=toMl(n,un[1].toLowerCase());if(ml!=null&&ml>400)out.push("«"+x+"»: quantità molto alta per un cocktail")}
    });
    if(isC){var b=baseMl(r);if(b.t>300)out.push("Totale degli ingredienti "+fmt(b.t)+" ml: molto alto per un drink");}
    return out;
  }
  function noteIssue(r){
    var t=(r.note||"")+" "+(r.ing||[]).join(" ");
    return /da verificare|da confermare|da controllare|non (è )?(specificat|indicat|chiar)|base non|manca|probabilmente|forse|incomplet|dubbi/i.test(t)?(r.note||"Un ingrediente non è specificato."):null;
  }
  function buildIssues(){
    var secs={inc:[],num:[],nota:[],dup:[],nome:[]},byId={};
    S.ricette.forEach(function(r){byId[r.id]=r});
    S.ricette.forEach(function(r){
      if(inc(r))secs.inc.push({r:r,kind:"inc",text:r.note||"Ricetta segnata come incompleta."});
      else{var nt=okHas(r,"nota")?null:noteIssue(r);if(nt)secs.nota.push({r:r,kind:"nota",text:nt})}
      if(!okHas(r,"numeri")&&!inc(r)){var ni=numIssues(r);if(ni.length)secs.num.push({r:r,kind:"numeri",text:ni.join("\n")})}
      (S.dup[r.id]||[]).forEach(function(g){
        if(g.tipo==="nome")return;
        var txt=g.label+": "+g.ids.filter(function(id){return id!==r.id}).map(function(id){var x=byId[id];return x?x.nome+(x.fonte?" ("+x.fonte+")":""):""}).filter(Boolean).join(", ");
        secs.dup.push({r:r,kind:"dup",text:txt});
      });
    });
    Object.keys(secs).forEach(function(k){secs[k].sort(function(a,b){return a.r.cat===b.r.cat?byName(a.r,b.r):a.r.cat.localeCompare(b.r.cat)})});
    return secs;
  }
  function issueCard(it){
    var r=it.r,ed=S.canEdit&&S.db;
    var h='<div class="issue"><div class="ih"><a href="#ricetta-'+esc(r.id)+'"><b>'+esc(r.nome)+'</b></a> <span class="src">'+esc([CATNAME[r.cat],r.fonte,r.gruppo].filter(Boolean).join(" · "))+'</span></div>';
    h+='<div class="it">'+esc(it.text).replace(/\n/g,"<br>")+'</div>';
    if(ed){
      h+='<div class="ia"><button class="btn" data-act="edit" data-id="'+esc(r.id)+'">Modifica</button>';
      if(it.kind==="inc")h+='<button class="btn" data-act="complete" data-id="'+esc(r.id)+'">Segna come completa</button>';
      else h+='<button class="btn" data-act="ok" data-kind="'+it.kind+'" data-id="'+esc(r.id)+'">'+(it.kind==="dup"?"Non è un doppione":"Va bene così")+'</button>';
      var sure=S.delId===r.id;
      h+='<button class="btn danger'+(sure?' sure':'')+'" data-act="del" data-id="'+esc(r.id)+'">'+(sure?'Conferma: elimina':'Elimina')+'</button></div>';
    }
    return h+'</div>';
  }
  function nameCluster(g){
    var byId={};S.ricette.forEach(function(r){byId[r.id]=r});
    var ed=S.canEdit&&S.db;
    var h='<div class="issue"><div class="ih"><b>'+esc(g.titolo)+'</b> <span class="src">'+g.ids.length+' ricette con questo nome</span></div>';
    g.ids.forEach(function(id){
      var r=byId[id];if(!r)return;
      h+='<div class="mrow"><a href="#ricetta-'+esc(r.id)+'">'+esc(r.nome)+'</a> <span class="src">'+esc([r.fonte,r.gruppo].filter(Boolean).join(" · "))+'</span>';
      if(ed){var sure=S.delId===r.id;h+='<span class="ia"><button class="btn" data-act="edit" data-id="'+esc(r.id)+'">Modifica</button><button class="btn danger'+(sure?' sure':'')+'" data-act="del" data-id="'+esc(r.id)+'">'+(sure?'Conferma: elimina':'Elimina')+'</button></span>'}
      h+='</div>';
    });
    if(ed)h+='<div class="ia"><button class="btn" data-act="okgroup" data-ids="'+esc(g.ids.join(","))+'">Sono varianti, va bene</button></div>';
    return h+'</div>';
  }
  function renderControllare(){
    var secs=S.issues,ng=S.dupg.filter(function(g){return g.tipo==="nome"}),tot=Object.keys(secs).reduce(function(t,k){return t+(k==="nome"?0:secs[k].length)},0)+ng.length;
    if(!tot)return '<div class="empty"><b>Tutto a posto</b>Non c\'è niente da controllare.</div>';
    var T=[["inc","Incompleti","Ricette a cui manca qualcosa. Completale con Modifica e poi segnale come complete."],
           ["num","Numeri da controllare","Quantità che sembrano strane o senza unità di misura."],
           ["nota","Note da verificare","Punti che non ero sicuro di aver capito dalle tue note."],
           ["dup","Possibili doppioni","Ricette identiche o con gli stessi ingredienti."],
           ["nome","Stesso nome","Spesso sono varianti di edizioni diverse: cancella solo se sono davvero uguali."]];
    var h='<div class="list">'+(S.formErr?'<div class="err">'+esc(S.formErr)+'</div>':'');
    T.forEach(function(t){
      if(t[0]==="nome"){
        if(!ng.length)return;
        h+='<h2 class="grp">'+t[1]+' ('+ng.length+')</h2><p class="src" style="margin:0 0 6px">'+t[2]+'</p>'+ng.map(nameCluster).join("");
        return;
      }
      var L=secs[t[0]];if(!L.length)return;
      h+='<h2 class="grp">'+t[1]+' ('+L.length+')</h2><p class="src" style="margin:0 0 6px">'+t[2]+'</p>'+L.map(issueCard).join("");
    });
    return h+'</div>';
  }

  /* ---- doppioni ---- */
  var STOP={di:1,al:1,alla:1,e:1,il:1,la:1,sciroppo:1,syrup:1,hm:1,dei:1,del:1,della:1,"in":1};
  function nameKey(r){return norm(String(r.nome||"").replace(/\(.*?\)/g,"")).split(" ").filter(function(w){return w&&!STOP[w]}).sort().join(" ")}
  function sigKey(r,noq){return (r.ing||[]).map(function(x){return norm(noq?x.replace(/^[\d\/.,\s-]+(ml|cl|oz|gr|g|kg|l|dash|dh|drop|bs)?\b/i,""):x)}).sort().join("|")}
  function dupCompute(){
    var info={},groups=[];
    if(!S.ricette){S.dup=info;S.dupg=groups;return}
    var TYPES=[["identica","Ricetta identica a",function(r){return (r.ing||[]).length>1?sigKey(r,false):null}],
               ["ingredienti","Stessi ingredienti (quantità diverse) di",function(r){return (r.ing||[]).length>1?sigKey(r,true):null}],
               ["nome","Stesso nome di",function(r){return nameKey(r)||null}]];
    TYPES.forEach(function(t){
      var map={};
      S.ricette.forEach(function(r){if(okHas(r,"dup"))return;var k=t[2](r);if(k==null)return;var kk=r.cat+"§"+k;(map[kk]=map[kk]||[]).push(r)});
      Object.keys(map).forEach(function(k){
        var g=map[k];if(g.length<2)return;
        var ids=g.map(function(r){return r.id});
        var already=groups.some(function(o){return ids.every(function(id){return o.ids.indexOf(id)>=0})});
        if(already)return;
        var grp={tipo:t[0],label:t[1],ids:ids,titolo:g[0].nome.replace(/\s*\(.*?\)/g,"")};
        groups.push(grp);
        ids.forEach(function(id){(info[id]=info[id]||[]).push(grp)});
      });
    });
    S.dup=info;S.dupg=groups;
  }
  function linkFor(name){
    var n=norm(name.replace(/\(.*?\)/g,""));if(n.length<4)return null;
    var l=S.ricette.filter(function(r){return r.cat!=="cocktail"&&!inc(r)&&(norm(r.nome.replace(/\(.*?\)/g,""))===n||(r.alias||[]).some(function(a){return norm(a.replace(/\(.*?\)/g,""))===n}))});
    return l.length?l[0]:null;
  }

  /* ---- routing con hash semplice ---- */
  function parse(h){
    h=String(h||"").replace(/^#/,"");
    try{h=decodeURIComponent(h)}catch(e){}
    if(h.indexOf("ricetta-")===0){S.open={k:"r",id:h.slice(8)}}
    else if(h.indexOf("lezione-")===0){S.open={k:"l",id:h.slice(8)}}
    else if(h.indexOf("appunto-")===0){S.open={k:"a",id:h.slice(8)}}
    else if(h.indexOf("menu-")===0){S.open={k:"m",id:h.slice(5)}}
    else if(h==="accesso"||h==="impostazioni"){S.open=null;S.panel=h}
    else{S.open=null;S.panel=null;if(TABS.some(function(t){return t[0]===h}))S.tab=h}
  }
  function readHash(){parse(location.hash)}
  function reset(){S.creating=false;S.msg="";S.panel=null;S.target=null;S.scale=1;S.edit=false;S.confirmDel=false;S.formErr=""}
  /* la navigazione non dipende dall'hash del browser: lo stato sta nella pagina, l'hash si aggiorna solo se possibile */
  function go(h){reset();parse(h);try{history.replaceState(null,"","#"+h)}catch(e){}render();window.scrollTo(0,0)}
  window.addEventListener("hashchange",function(){reset();readHash();render()});
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]');
    if(!a)return;
    e.preventDefault();
    var h=a.getAttribute("href").slice(1);
    if(h)go(h);
  });

  /* ---- render ---- */
  function counts(){var c={};if(S.ricette)S.ricette.forEach(function(r){if(!inc(r))c[r.cat]=(c[r.cat]||0)+1});if(S.menu)c.menu=S.menu.length;if(S.lezioni)c.lezioni=S.lezioni.length;if(S.appunti)c.appunti=S.appunti.length;var iss=S.issues||{};c.controllare=Object.keys(iss).reduce(function(t,k){return t+iss[k].length},0)+(S.dupg||[]).filter(function(g){return g.tipo==="nome"}).length;return c}
  function renderTabs(){
    var c=counts();

      var sel=!S.open&&!S.q&&S.tab===t[0];
      return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+sel+'">'+esc(t[1])+(c[t[0]]!=null?'<span class="n">'+c[t[0]]+'</span>':'')+'</button>'}).join("");

  }
  function groupsFonte(items){

    var keys=FONTI.filter(function(g){return map[g]}).concat(Object.keys(map).filter(function(g){return FONTI.indexOf(g)<0}).sort());

      });
    });

    var L=(S.appunti||[]).slice().sort(function(a,b){return (a.ordine||99)-(b.ordine||99)});

    var byId={};S.ricette.forEach(function(r){byId[r.id]=r});

  function renderList(){
    var q=norm(S.q);
    if(q){
      var rs=S.ricette.filter(function(r){return haystack(r).indexOf(q)>=0}).sort(byName);
      var ls=(S.lezioni||[]).filter(function(l){return norm(l.titolo+" "+l.sommario+" "+JSON.stringify(l.sezioni||[])).indexOf(q)>=0});
      var as=(S.appunti||[]).filter(function(l){return norm(l.titolo+" "+l.sommario+" "+JSON.stringify(l.sezioni||[])).indexOf(q)>=0});
      if(!rs.length&&!ls.length&&!as.length)return '<div class="empty"><b>Nessun risultato</b>Prova con una parola più corta o con il nome di un ingrediente.</div>';
      var h='<div class="list">';
      if(rs.length)h+='<h2 class="grp">Ricette ('+rs.length+')</h2>'+rs.map(function(r){return row(r,true)}).join("");
      if(ls.length)h+='<h2 class="grp">Lezioni ('+ls.length+')</h2>'+ls.map(lezRow).join("");
      if(as.length)h+='<h2 class="grp">Appunti ('+as.length+')</h2>'+as.map(function(l){return '<a class="row" href="#appunto-'+esc(l.id)+'"><span class="rn">'+esc(l.titolo)+'<div class="rs">'+esc(l.sommario||"")+'</div></span></a>'}).join("");
      return h+'</div>';
    }
    if(S.tab==="menu")return renderMenu();
    if(S.tab==="appunti")return renderAppunti();
    if(S.tab==="controllare")return renderControllare();
    if(S.tab==="lezioni"){
      var L=(S.lezioni||[]).slice().sort(function(a,b){return (a.ordine||99)-(b.ordine||99)});
      if(!L.length)return '<div class="empty"><b>Nessuna lezione</b>Le lezioni e i corsi compariranno qui.</div>';
      return '<div class="list">'+L.map(function(l){return '<a class="lezcard" href="#lezione-'+esc(l.id)+'"><strong>'+esc(l.titolo)+'</strong><span>'+esc(l.sommario||"")+'</span></a>'}).join("")+'</div>';
    }
    if(S.tab==="incompleti"){
      var I=S.ricette.filter(inc);
      if(!I.length)return '<div class="empty"><b>Nessuna ricetta incompleta</b>Le ricette a cui manca qualcosa compaiono qui finché non le segni come complete.</div>';
      var by={};I.forEach(function(r){(by[r.cat]=by[r.cat]||[]).push(r)});
      return '<div class="list">'+Object.keys(by).map(function(c){return '<h2 class="grp">'+esc(CATNAME[c]||c)+'</h2>'+by[c].sort(byName).map(function(r){return row(r,false)}).join("")}).join("")+'</div>';
    }

  }

  function render(){
    document.body.classList.toggle("locked",!S.role);

    if(S.panel&&!S.edit){m.innerHTML=renderPanel();return}
    if(S.err){m.innerHTML='<div class="empty"><b>Ricettario non disponibile</b>'+esc(S.err)+'</div>';return}
    if(S.ricette==null||S.lezioni==null||S.menu==null||S.appunti==null){return}
    if(S.edit)return; /* non ridisegnare mentre si modifica */

      var cat=CATNAME[S.tab]?S.tab:"cocktail";
      reset();S.open=null;S.creating=true;S.edit=true;S.formErr="";
      $("main").innerHTML=formRecipe({cat:cat});window.scrollTo(0,0);
    }
  });
  document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="pw")doLogin()});

  readHash();render();
  if(!window.crypto||!crypto.subtle){S.formErr="Questo browser non è abbastanza recente per aprire il ricettario.";render()}
  else fetchFile().then(function(f){
    S.file=f;
    var sess=null;try{sess=JSON.parse(localStorage.getItem(SESS)||"null")}catch(x){}
    if(!sess||!sess.dk)return;
    var raw=b64d(sess.dk);
    return dkKey(raw).then(function(k){return readData(f,k).then(function(d){S.role=sess.role;S.dk=k;S.dkRaw=raw;S.tok=sess.tok||null;afterAuth(d)})}).catch(function(){sessClear()});
  }).catch(function(){S.formErr="Non riesco a leggere il ricettario. Controlla la connessione e riprova.";render()});
})();
</script>
