  /* ---- Unisci ricette: motore di somiglianza ---- */
  var UN_STOP={top:1,fresco:1,fresca:1,fresche:1,freschi:1,di:1,al:1,alla:1,allo:1,agli:1,del:1,della:1,dello:1,dei:1,delle:1,e:1,il:1,la:1,lo:1,un:1,una:1,con:1,"in":1,a:1,da:1,hm:1,sciroppo:1,syrup:1};
  var UN_UNI={ml:1,cl:1,oz:1,gr:1,g:1,kg:1,l:1,dash:1,dashes:1,dh:1,drop:1,drops:1,bs:1,pz:1,pezzi:1,pezzo:1,foglie:1,foglia:1,fetta:1,fette:1,spicchio:1,spicchi:1,goccia:1,gocce:1,pizzico:1,pinch:1,cucchiaio:1,cucchiai:1,cucchiaino:1};
  function unToks(t){
    var s=String(t||"").replace(/\(.*?\)/g," ").replace(/^\s*[\d\/.,\s-]+/,"");
    var w=norm(s).split(" ").filter(Boolean);
    while(w.length&&UN_UNI[w[0]])w.shift();
    return w.filter(function(x){return !UN_STOP[x]&&!/^\d+$/.test(x)});
  }
  function unIsIce(w){return w.some(function(x){return /^(ghiaccio|lingotto|cubetti|cubetto|crushed|ice|cubo|cubi)$/.test(x)})}
  function unTokEq(a,b){if(a===b)return true;if(a.length<5||b.length<5)return false;return a.slice(0,5)===b.slice(0,5)}
  function unDice(A,B){
    if(!A.length||!B.length)return 0;
    var used={},hit=0;
    A.forEach(function(a){for(var j=0;j<B.length;j++){if(!used[j]&&unTokEq(a,B[j])){used[j]=1;hit++;break}}});
    return 2*hit/(A.length+B.length);
  }
  function unIngsIdx(r){var o=[];(r.ing||[]).forEach(function(t,i){var w=unToks(t);if(w.length&&!unIsIce(w))o.push({i:i,w:w})});return o}
  var UNC={};
  function unTok(r){
    var sig=(r.ing||[]).join("§")+"|"+r.nome+"|"+r.cat,c=UNC[r.id];
    if(c&&c.sig===sig)return c;
    c={sig:sig,ix:unIngsIdx(r),nm:unNameToks(r)};c.w=c.ix.map(function(x){return x.w});
    UNC[r.id]=c;return c;
  }
  function unIngSim(A,B){
    /* abbinamento uno a uno degli ingredienti: ogni ingrediente prende il migliore ancora libero */
    if(!A.length||!B.length)return {s:0,m:[]};
    var pairs=[];
    A.forEach(function(a,i){B.forEach(function(b,j){var d=unDice(a,b);if(d>=0.6)pairs.push([d,i,j])})});
    pairs.sort(function(x,y){return y[0]-x[0]});
    var ua={},ub={},tot=0,m=[];
    pairs.forEach(function(p){if(ua[p[1]]||ub[p[2]])return;ua[p[1]]=1;ub[p[2]]=1;tot+=p[0];m.push([p[1],p[2]])});
    return {s:2*tot/(A.length+B.length),m:m};
  }
  function unNameToks(r){return norm(dn(r).replace(/\(.*?\)/g,"")).split(" ").filter(function(x){return x&&!UN_STOP[x]&&x!=="blend"})}
  function unScore(a,b){
    var ta=unTok(a),tb=unTok(b),is=unIngSim(ta.w,tb.w),ns=unDice(ta.nm,tb.nm);
    var s=0.8*is.s+0.2*ns;
    if(ns>=0.99&&is.s>=0.3)s=Math.max(s,0.5+0.5*is.s);
    return {s:Math.min(1,s),ing:is.s,nome:ns,m:is.m};
  }
  function unPairs(){
    var out=[],by={};
    S.ricette.forEach(function(r){(by[r.cat]=by[r.cat]||[]).push(r)});
    Object.keys(by).forEach(function(c){
      var L=by[c];
      for(var i=0;i<L.length;i++)for(var j=i+1;j<L.length;j++){
        var sc=unScore(L[i],L[j]);
        if(sc.s>=0.4)out.push({a:L[i].id,b:L[j].id,cat:c,s:sc.s,ing:sc.ing,nome:sc.nome});
      }
    });
    out.sort(function(x,y){return y.s-x.s});
    return out;
  }

  /* ---- Impostazioni → Carica liste: un testo diventa una o più ricette ---- */
  S.imp={txt:"",cat:"cocktail",prev:false,tipo:"auto"};
  var IMP_ICE=/cubett|cubi\b|chunk|sfera|tritat|ghiacci|crushed|nessun|tower|pebble/i;
  var IMP_COD={s:"Shake",sd:"Shake double strain",ss:"Stir and strain",b:"Build",bl:"Blend",fb:"Flash blend",t:"Throwing"};
  function impTec(p){
    var x=norm(p);if(!x)return "";
    if(IMP_COD[x])return IMP_COD[x];
    if(/double/.test(x))return "Shake double strain";
    if(/stir/.test(x))return "Stir and strain";
    if(/flash/.test(x))return "Flash blend";
    if(/throw/.test(x))return "Throwing";
    if(/blend/.test(x))return "Blend";
    if(/shake/.test(x))return "Shake";
    if(/build/.test(x))return "Build";
    return "";
  }
  function impNome(s){
    s=String(s||"").replace(/[\s.:;,]+$/,"").replace(/^[\s#*\-]+/,"").trim();
    if(s&&s===s.toUpperCase()&&s!==s.toLowerCase())s=s.toLowerCase();
    return s.charAt(0).toUpperCase()+s.slice(1);
  }
  /* una riga di ingrediente: i numeri senza unità sono ml (le frazioni once); sotto 5 senza unità resta com'è e va controllato */
  function impIng(l){
    var t=String(l).replace(/\s+/g," ").trim();
    var tp=t.match(/^top\s+(.+)$/i);if(tp)return {s:"top "+tp[1],w:false};
    var m=t.match(NUM);if(!m)return {s:t,w:false};
    var num=m[1],rest=m[2];
    if(!rest)return {s:t,w:true};
    var un=rest.match(UNIT);
    if(un)return {s:num+" "+un[1].toLowerCase()+(un[2]?" "+un[2]:""),w:false};
    if(num.indexOf("/")>=0)return {s:num+" oz "+rest,w:false};
    var n=toNum(num);
    if(!isNaN(n)&&n<5&&!/[.,]/.test(num))return {s:t,w:true};
    return {s:num+" ml "+rest,w:false};
  }
  /* riga dopo gli ingredienti: bicchiere, ghiaccio, tecnica, decorazione separati da virgole, in qualunque ordine dopo il bicchiere */
  function impInfo(l){
    var o={bic:"",ghi:"",tec:"",tn:"",guarn:[]};
    var parts=String(l||"").split(",").map(function(x){return x.trim()}).filter(Boolean);
    parts.forEach(function(p,i){
      var t=impTec(p);
      if(i===0&&!t&&!IMP_ICE.test(p)){o.bic=p.charAt(0).toUpperCase()+p.slice(1);return}
      if(!o.tec&&t){
        o.tec=t;
        var left=norm(p).replace(/\b(shake|double|strain|stir|and|build|blend|flash|throwing|throw|e|ed|a|il|la|sd|ss|bl|fb)\b/g," ").replace(/\s+/g," ").trim();
        if(left&&!IMP_COD[norm(p)])o.tn=p;
        return;
      }
      if(!o.ghi&&IMP_ICE.test(p)){o.ghi=p;return}
      o.guarn.push(p);
    });
    return o;
  }
  function impGlassId(nome,arr){
    var x=norm(nome);if(!x)return "";
    var e=arr.filter(function(g){return norm(g.nome)===x||g.id===slug(nome)})[0];
    if(e)return e.id;
    e=arr.filter(function(g){var y=norm(g.nome);return y.length>=5&&x.length>=5&&(y.indexOf(x)>=0||x.indexOf(y)>=0)})[0];
    return e?e.id:"";
  }
  function impParse(text,cat){
    var lines=String(text||"").replace(/\r/g,"").split("\n").map(function(l){return l.replace(/\s+/g," ").trim()});
    var isI=function(l){return /^\d/.test(l)||(/^top\s/i.test(l)&&l.indexOf(",")<0)};
    var isG=function(l){return /bicc|bicch|tiki|mug|levitas|savage|\bpub\b|top class|calice|coppa|flute|tumbler|highball|rocks|collins|boccale|tazza|lowball|nick|coupe/i.test(l)};
    var anyIng=lines.some(isI),list=[],cur=null,i,open=function(n){cur={nome:n,ing:[],info:"",note:[]};list.push(cur);return cur};
    for(i=0;i<lines.length;i++){
      var l=lines[i];
      if(!l){cur=null;continue}
      if(!anyIng){open(impNome(l));continue}
      if(/^note?\s*:/i.test(l)){if(!cur)open("");cur.note.push(l.replace(/^note?\s*:\s*/i,""));continue}
      if(isI(l)){if(!cur)open("");cur.ing.push(l);continue}
      if(!cur){open(impNome(l));continue}
      if(!cur.ing.length){cur.note.push(l);continue}
      var nx=lines[i+1];
      if(!cur.nome&&!cur.info&&l.indexOf(",")<0&&nx&&!isI(nx)){cur.nome=impNome(l);continue}
      if(!cur.info&&l.indexOf(",")<0&&!isG(l)&&!impTec(l)&&!IMP_ICE.test(l)){cur.ing.push(l);continue}
      if(!cur.info){cur.info=l;continue}
      open(impNome(l));
    }
    var sn=0,warn=0,gl=(S.bicchieri||[]).map(function(g){return {id:g.id,nome:g.nome}}),nuovi=[];
    var out=list.map(function(c){
      var w=0,inf=impInfo(c.info);
      var ing=c.ing.map(function(x){var q=impIng(x);if(q.w)w++;return q.s});
      var r={nome:c.nome,cat:cat,ing:ing,ghiaccio:inf.ghi,tecnica:inf.tec,tecnica_nota:inf.tn,guarn:inf.guarn.join(", "),note:c.note.join("\n"),bicNome:inf.bic,w:w};
      if(!r.nome){sn++;r.nome="Ricetta senza nome "+sn;r.senza=true}
      if(cat==="cocktail"&&/analcolic/i.test(r.nome))r.cat="analcolico";
      if(!ing.length||r.senza)r.stato="incompleta";
      r.doppia=(S.ricette||[]).some(function(x){return norm(x.nome)===norm(r.nome)&&x.cat===r.cat});
      if(inf.bic&&!impGlassId(inf.bic,gl)&&nuovi.indexOf(inf.bic)<0)nuovi.push(inf.bic);
      warn+=w;return r;
    });
    return {list:out,nuovi:nuovi,warn:warn};
  }
  /* ---- Carica liste: capisce da solo se il testo è una lista di drink o una lezione/corso ---- */
  function impTipo(text){
    var L=String(text||"").replace(/\r/g,"").split("\n").map(function(l){return l.trim()}).filter(Boolean);
    if(!L.length)return {tipo:"ricette",perche:""};
    var ing=L.filter(function(l){return NUM.test(l)&&!/^\d+[.)]\s/.test(l)&&l.length<=60}).length,r=ing/L.length;
    var kw=/\b(lezione|lezioni|corso|masterclass|workshop|seminario|appunti|formazione)\b/i.test(L.slice(0,2).join(" "));
    var tot=L.join(" ").length,avg=tot/L.length;
    if(ing>=3&&r>=0.3&&!(kw&&r<0.5))return {tipo:"ricette",perche:"ci sono righe con quantità"};
    if(kw)return {tipo:"lezione",perche:"all'inizio si parla di una lezione o di un corso"};
    if(avg>=60||tot>=400)return {tipo:"lezione",perche:"è un testo discorsivo, senza quantità"};
    return {tipo:"ricette",perche:"sono righe brevi, come un elenco di nomi"};
  }
  function impLez(text){
    var raw=String(text||"").replace(/\r/g,"").split("\n").map(function(l){return l.replace(/\s+/g," ").trim().replace(/^#+\s*/,"").replace(/\*\*/g,"")});
    var L=raw.filter(function(l){return l});
    if(!L.length)return null;
    var titolo=L.shift().replace(/^(lezione|corso|appunti|masterclass|workshop)\s*(n\.?\s*\d+)?\s*[:\-–—]\s*/i,"").replace(/[\s:.]+$/,"");
    titolo=titolo.charAt(0).toUpperCase()+titolo.slice(1);
    var isB=function(l){return /^([-•*–]|\d+[.)])\s+/.test(l)};
    var isH=function(l,nx){
      if(!nx||isB(l)||l.length>60)return false;
      if(/:$/.test(l))return true;
      if(/[.!?;,]$/.test(l))return false;
      if(l===l.toUpperCase()&&l!==l.toLowerCase())return true;
      return isB(nx)||nx.length>=50;
    };
    var sez=[],pts=null,nb=0;
    for(var i=0;i<L.length;i++){
      var l=L[i],nx=L[i+1];
      if(isB(l)){if(!pts){pts=[];sez.push({titolo:"",punti:pts})}pts.push(l.replace(/^([-•*–]|\d+[.)])\s+/,""));nb++;continue}
      pts=null;
      if(isH(l,nx)){var h=l.replace(/:$/,"");sez.push({titolo:h.charAt(0).toUpperCase()+h.slice(1)});continue}
      sez.push({titolo:"",testo:l});
    }
    var sommario="";
    if(sez.length>1&&sez[0].testo&&sez[0].testo.length<=300){sommario=sez[0].testo;sez.shift()}
    var nt=sez.filter(function(x){return x.titolo}).length;
    return {titolo:titolo||"Lezione senza titolo",sommario:sommario,sezioni:sez,nt:nt,nb:nb,doppia:(S.lezioni||[]).some(function(x){return norm(x.titolo)===norm(titolo)})};
  }
  function impHtml(){
    var I=S.imp,auto=I.tipo==="auto"?impTipo(I.txt):null,tipo=I.tipo==="auto"?auto.tipo:I.tipo;
    var h='<h3>Carica liste, ricette o lezioni</h3><p>Incolla un testo o scegli un file: capisco da solo se è una lista di drink o una lezione/corso e ti dico dove lo metto, prima di aggiungere.</p>'+
      '<p class="hint"><b>Drink:</b> per ognuno il nome, poi un ingrediente per riga con la quantità davanti (i numeri senza unità sono ml, le frazioni once), poi una riga con bicchiere, ghiaccio, tecnica e decorazione separati da virgole. Riga vuota tra un drink e l\'altro. Se la lista ha solo nomi le ricette nascono incomplete. <b>Lezioni:</b> la prima riga è il titolo; le righe brevi seguite da testo diventano titoli di paragrafo e le righe con trattino o numero diventano elenchi.</p>'+
      '<label for="imp-tipo">Cosa sto caricando</label><select id="imp-tipo"><option value="auto"'+(I.tipo==="auto"?' selected':'')+'>Decidi tu</option><option value="ricette"'+(I.tipo==="ricette"?' selected':'')+'>Una lista di drink o ricette</option><option value="lezione"'+(I.tipo==="lezione"?' selected':'')+'>Una lezione o un corso</option></select>'+
      (tipo!=="lezione"?'<label for="imp-cat">Sezione delle ricette</label><select id="imp-cat">'+catOptions(I.cat)+'</select>':'')+
      '<label for="imp-file">Scegli un file di testo</label><input id="imp-file" type="file" accept=".txt,.md,.csv,text/plain">'+
      '<label for="imp-txt">Oppure incolla qui il testo</label><textarea id="imp-txt" rows="10" autocapitalize="none">'+esc(I.txt)+'</textarea>'+
      '<div class="actions"><button class="btn pri" data-ui="impprev">Controlla</button><button class="btn" data-ui="impclear">Svuota</button></div>';
    if(I.prev){
      if(auto&&I.txt.trim())h+='<p class="hint">Ho capito che è '+(auto.tipo==="lezione"?'una lezione o un corso':'una lista di drink')+' ('+esc(auto.perche)+'). Se non è così, cambia «Cosa sto caricando».</p>';
      if(tipo==="lezione"){
        var Z=impLez(I.txt);
        if(!Z)h+='<p class="hint">Non ho trovato testo da aggiungere.</p>';
        else h+='<p><b>La aggiungo a Libri e corsi, in «Corsi e lezioni».</b></p><div class="list"><div class="row"><span class="rn">'+esc(Z.titolo)+'<div class="rs">'+esc([Z.sezioni.length+" blocchi",Z.nt?Z.nt+" titoli di paragrafo":"nessun titolo di paragrafo",Z.nb?Z.nb+" punti elenco":"",Z.sommario?"con riassunto in alto":"",Z.doppia?"stesso titolo di una lezione già presente":""].filter(Boolean).join(" · "))+'</div></span></div></div>'+
          '<div class="actions"><button class="btn pri" data-ui="impaddl">Aggiungi ai corsi</button></div>';
      }else{
        var P=impParse(I.txt,I.cat);
      if(!P.list.length)h+='<p class="hint">Non ho trovato ricette in questo testo.</p>';
      else{
        h+='<p><b>'+P.list.length+' ricette da aggiungere</b>'+(P.nuovi.length?'. Bicchieri nuovi che creo: '+esc(P.nuovi.join(", ")):'')+(P.warn?'. '+P.warn+' quantità senza unità sotto 5: restano come scritte, da controllare':'')+'.</p><div class="list">'+
        P.list.map(function(r){
          var b=[];
          b.push(CATNAME[r.cat]||r.cat);
          b.push(r.ing.length?r.ing.length+" ingredienti":"solo nome");
          if(r.bicNome)b.push(r.bicNome);
          if(r.tecnica)b.push(r.tecnica);
          if(r.ghiaccio)b.push(r.ghiaccio);
          if(r.guarn)b.push(r.guarn);
          if(r.stato==="incompleta")b.push("incompleta");
          if(r.senza)b.push("manca il nome");
          if(r.doppia)b.push("stesso nome di una ricetta già presente: finisce in «Da controllare»");
          return '<div class="row"><span class="rn">'+esc(r.nome)+'<div class="rs">'+esc(b.join(" · "))+'</div></span></div>';
        }).join("")+'</div><div class="actions"><button class="btn pri" data-ui="impadd">Aggiungi '+P.list.length+' ricette</button></div>';
      }
      }
    }
    return h;
  }
  function impAddL(){
    if(!S.db){flash("Prima salva il collegamento a GitHub da Impostazioni → Sicurezza e accesso.",1);return}
    var Z=impLez(S.imp.txt);
    if(!Z){flash("Non ho trovato testo da aggiungere.",1);return}
    S.busy=true;S.msg="";S.formErr="";var nid="";

      d.lezioni=d.lezioni||{};
      var id=slug(Z.titolo),base=id,n=2;while(d.lezioni[id]){id=base+"-"+n;n++}
      var mx=0;Object.keys(d.lezioni).forEach(function(k){var o=+(d.lezioni[k]||{}).ordine||99;if(o>mx)mx=o});
      var rec={titolo:Z.titolo,sezioni:Z.sezioni,ordine:mx+1};if(Z.sommario)rec.sommario=Z.sommario;
      d.lezioni[id]=rec;nid=id;
    },"Lezione aggiunta dal sito: "+Z.titolo).then(function(){
      S.busy=false;S.imp.txt="";S.imp.prev=false;go("lezione-"+nid);
    },function(e){S.busy=false;flash(saveMsg(e),1)});
  }
  function impAdd(){
    if(!S.db){flash("Prima salva il collegamento a GitHub da Impostazioni → Sicurezza e accesso.",1);return}
    var P=impParse(S.imp.txt,S.imp.cat);
    if(!P.list.length){flash("Non ho trovato ricette nella lista.",1);return}
    S.busy=true;S.msg="";S.formErr="";
    applyOp(function(d){
      d.ricette=d.ricette||{};d.bicchieri=d.bicchieri||{};
      P.list.forEach(function(r){
        var arr=Object.keys(d.bicchieri).map(function(k){return {id:k,nome:(d.bicchieri[k]||{}).nome||k}});
        var bid=r.bicNome?impGlassId(r.bicNome,arr):"";
        if(r.bicNome&&!bid){bid=slug(r.bicNome);var b0=bid,k=2;while(d.bicchieri[bid]){bid=b0+"-"+k;k++}d.bicchieri[bid]={nome:r.bicNome}}
        var id=slug(r.nome),base=id,n=2;
        while(d.ricette[id]){id=base+"-"+n;n++}
        var rec={nome:r.nome,cat:r.cat,ing:r.ing,bicchiere:bid,ghiaccio:r.ghiaccio,tecnica:r.tecnica,tecnica_nota:r.tecnica_nota,guarn:r.guarn,note:r.note,stato:r.stato};
        d.ricette[id]=clean(rec);
      });
    },"Caricamento lista dal sito: "+P.list.length+" ricette").then(function(){
      S.busy=false;S.imp.txt="";S.imp.prev=false;flash(P.list.length+" ricette aggiunte"+(P.list.some(function(r){return r.stato==="incompleta"})?": quelle incomplete le trovi in «Incompleti»":"")+".");
    },function(e){S.busy=false;flash(saveMsg(e),1)});
  }
  function flash(msg,err){S.szMsg="";S.msg=err?"":msg;S.formErr=err?msg:"";render()}

    }).catch(function(e){S.busy=false;S.role=null;flash(e&&e.message==="bad"?"Password sbagliata.":"Non riesco a leggere il ricettario. Controlla la connessione.",1)});
  }
  function doLogout(){sessClear();S.role=null;S.dk=null;S.dkRaw=null;S.tok=null;S.canEdit=false;S.db=null;S.edit=false;S.panel=null;S.open=null;S.ricette=S.lezioni=S.menu=S.appunti=S.bicchieri=S.impostazioni=null;S.msg="";S.formErr="";render()}
  function doSaveTok(){
    var tk=($("tk")||{}).value.trim(),pw=($("tkpw")||{}).value||"";
    if(!tk||!pw){flash("Compila token e password capo.",1);return}
    S.busy=true;flash("Controllo…");
    tryRole(S.file,pw,"boss").then(function(r){
      var old=S.tok;S.tok=tk;
      return aesEnc(r.k,enc8.encode(tk)).then(function(t){
        return commit(function(file){var f=Object.assign({},file);f.tok=t;return Promise.resolve(f)},"Collegamento GitHub dal sito").then(function(nf){S.file=nf;S.lastSave=Date.now();S.busy=false;S.canEdit=true;S.db=makeDb();sessSave();flash("Collegamento attivo. Ora puoi modificare le ricette.")});
      }).catch(function(e){S.tok=old;throw e});
    }).catch(function(e){S.busy=false;flash(e&&e.status?saveMsg(e):"Password capo sbagliata.",1)});
  }
  function doChBoss(){
    var p1=$("pb1").value,p2=$("pb2").value;
    if(p1.length<6){flash("La nuova password deve avere almeno 6 caratteri.",1);return}
    if(p1!==p2){flash("Le due password non coincidono.",1);return}
    if(!S.tok){flash("Prima salva il collegamento a GitHub.",1);return}
    S.busy=true;flash("Salvo…");
    rewrap(p1,S.dkRaw).then(function(r){return aesEnc(r.k,enc8.encode(S.tok)).then(function(t){
      return commit(function(file){var f=Object.assign({},file);f.boss=r.w;f.tok=t;return Promise.resolve(f)},"Password capo cambiata")});
    }).then(function(nf){S.file=nf;S.lastSave=Date.now();S.busy=false;flash("Password capo cambiata.")},function(e){S.busy=false;flash(saveMsg(e),1)});
  }
  function doChStaff(){
    var p=$("ps1").value.trim();
    if(p.length<4){flash("La password deve avere almeno 4 caratteri.",1);return}
    if(!S.tok){flash("Prima salva il collegamento a GitHub.",1);return}
    S.busy=true;flash("Salvo…");
    rewrap(p,S.dkRaw).then(function(r){return commit(function(file){var f=Object.assign({},file);f.staff=r.w;return Promise.resolve(f)},"Password dipendenti cambiata")}).then(function(nf){S.file=nf;S.lastSave=Date.now();S.busy=false;flash("Password dipendenti cambiata. Comunicala ai dipendenti.")},function(e){S.busy=false;flash(saveMsg(e),1)});
  }
  function glassWrite(id,d,msg){
    if(!S.db){flash("Prima salva il collegamento a GitHub da Impostazioni → Sicurezza e accesso.",1);return}
    var dc=S.db.doc("bicchieri/"+id);
    S.busy=true;
    (d===null?dc.delete():dc.set(d)).then(function(){S.busy=false;flash(msg)},function(e){S.busy=false;flash(saveMsg(e),1)});
  }
  function glassData(n,c){var nome=(n||"").trim();if(!nome)return null;var cap=parseFloat(String(c||"").replace(",","."));var d={nome:nome};if(cap>0)d.capienza=cap;return d}
  /* backup: tutto il contenuto dei dati così com'è (tutte le sezioni, anche quelle aggiunte in futuro) */
  function doBackup(){
    try{
      var out=S.raw?JSON.parse(JSON.stringify(S.raw)):{};
      COLS.forEach(function(c){
        if(out[c]&&typeof out[c]==="object")return;
        out[c]={};(S[c]||[]).forEach(function(r){var o=Object.assign({},r);delete o.id;out[c][r.id]=o});
      });
      var nr=Object.keys(out.ricette||{}).length;
      var blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ricettario-backup-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
      flash("Backup scaricato ("+nr+" ricette).");
    }catch(e){flash("Non sono riuscito a preparare il backup ("+((e&&e.message)||"errore")+"). Riprova.",1)}
  }
  function doPdf(){
    var sel=($("pdfsel")||{}).value||"tutto",ORD=pdfCats(),cats=sel==="tutto"?ORD:[sel],keep=S.unit,h="";
    S.unit="ml";
    cats.forEach(function(c){
      var L=(S.ricette||[]).filter(function(r){return r.cat===c&&!inc(r)}).sort(byName);if(!L.length)return;
      h+='<section><h1>'+esc(CATNAME[c])+'</h1><div class="pcols">'+L.map(function(r){
        var g=glassOf(r),tc=(r.tecnica||"")+(r.tecnica&&r.tecnica_nota?" · ":"")+(r.tecnica_nota||"");
        var meta=[g?"Bicchiere: "+glassLabel(g):"",r.ghiaccio?"Ghiaccio: "+r.ghiaccio:"",tc?"Tecnica: "+tc:"",r.guarn?"Decorazione: "+r.guarn:""].filter(Boolean);
        return '<article><h2>'+esc(dn(r))+'</h2><ul>'+(r.ing||[]).map(function(t){var x=split(t,1);return '<li><span>'+esc(x.q)+'</span> '+esc(x.t)+'</li>'}).join("")+'</ul>'+
          (meta.length?'<p class="pm">'+meta.map(esc).join('<br>')+'</p>':'')+(r.metodo?'<p>Metodo: '+esc(r.metodo)+'</p>':'')+(r.proc?'<p>'+esc(r.proc)+'</p>':'')+(r.note?'<p class="pn">Note: '+esc(r.note)+'</p>':'')+'</article>';
      }).join("")+'</div></section>';
    });
    S.unit=keep;
    if(!h){flash("Non c'è niente da stampare in questa sezione.",1);return}
    var old=$("printroot");if(old)old.remove();
    var root=document.createElement("div");root.id="printroot";root.innerHTML=h;document.body.appendChild(root);
    var done=function(){window.removeEventListener("afterprint",done);var r0=$("printroot");if(r0)r0.remove()};
    window.addEventListener("afterprint",done);
    setTimeout(function(){window.print()},250);
  }
  function doElenco(){
    var L=["ELENCO DRINK - compila dopo i due punti, lascia vuoto ciò che non sai","Tecniche: S shake, SD shake double strain, SS stir and strain, B build, BL blend, FB flash blend, T throwing",""];
    var cs=(S.ricette||[]).filter(function(r){return r.cat==="cocktail"||r.cat==="analcolico"}).sort(byName);
    cs.forEach(function(r){var g=glassOf(r);
      L.push("## "+dn(r));
      L.push("Ingredienti: "+(r.ing||[]).join("; "));
      L.push("Bicchiere: "+(g?g.nome:""));
      L.push("Ghiaccio: "+(r.ghiaccio||""));
      L.push("Tecnica: "+(r.tecnica||""));
      L.push("Decorazione: "+(r.guarn||""));
      L.push("")});
    var blob=new Blob([L.join("\n")],{type:"text/plain;charset=utf-8"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="elenco-drink-"+new Date().toISOString().slice(0,10)+".txt";
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
    flash("Elenco scaricato ("+cs.length+" drink).");
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("[data-ui]");if(!b)return;
    var a=b.getAttribute("data-ui");
    if(a==="login")doLogin();
    else if(a==="refresh")refreshNow(b);
    else if(a==="logout"){if(confirm("Uscire dall'account?"))doLogout()}
    else if(a==="savetok")doSaveTok();
    else if(a==="chboss")doChBoss();
    else if(a==="chstaff")doChStaff();
    else if(a==="backup")doBackup();
    else if(a==="osu"||a==="ogiu"){var oi2=parseInt(b.getAttribute("data-i"),10),oj=a==="osu"?oi2-1:oi2+1;S.ord=S.ord||orderIds();if(oj>=0&&oj<S.ord.length){var ot=S.ord[oi2];S.ord[oi2]=S.ord[oj];S.ord[oj]=ot}S.msg="";S.formErr="";render()}
    else if(a==="osalva"){if(!S.db){flash("Prima salva il collegamento a GitHub da Impostazioni → Sicurezza e accesso.",1);return}S.busy=true;S.db.doc("impostazioni/ordine").set({lista:S.ord||orderIds(),nomi:nomiDiff()}).then(function(){S.busy=false;flash("Ordine salvato.")},function(e){S.busy=false;flash(saveMsg(e),1)})}
    else if(a==="oreset"){S.nomi={};S.ord=TABS.map(function(t){return t[0]});S.msg="";S.formErr="";render()}
    else if(a==="dsalva")doDilSalva();
    else if(a==="dreset"){var dd={};TECNICHE.forEach(function(tt){dd[tt]=DIL_DEF[tt]!=null?String(DIL_DEF[tt]):""});S.dilForm=dd;S.msg="Valori di partenza rimessi: premi «Salva diluizioni» per tenerli.";S.formErr="";render()}
    else if(a==="elenco")doElenco();
    else if(a==="impprev"){var ti=$("imp-txt");if(ti)S.imp.txt=ti.value;S.imp.prev=true;S.msg="";S.formErr="";render()}
    else if(a==="impclear"){S.imp.txt="";S.imp.prev=false;render()}
    else if(a==="impadd"){if(!S.busy)impAdd()}
    else if(a==="impaddl"){if(!S.busy)impAddL()}
    else if(a==="pdf")doPdf();
    else if(a==="gsave"){var gi=b.getAttribute("data-id"),gd1=glassData(($("gn-"+gi)||{}).value,($("gc-"+gi)||{}).value);if(!gd1){flash("Il nome non può essere vuoto.",1);return}glassWrite(gi,gd1,"Bicchiere salvato.")}
    else if(a==="gdel"){var gi2=b.getAttribute("data-id"),us=(S.ricette||[]).filter(function(x){return x.bicchiere===gi2}).length;
      if(us){flash("Questo bicchiere è usato in "+us+" ricette: cambialo prima in quelle ricette.",1);return}
      if(confirm("Eliminare il bicchiere?"))glassWrite(gi2,null,"Bicchiere eliminato.")}
    else if(a==="gadd"){var gd2=glassData(($("gnew-n")||{}).value,($("gnew-c")||{}).value);if(!gd2){flash("Scrivi il nome del bicchiere.",1);return}
      var gi3=slug(gd2.nome),k=2,base=gi3;while((S.bicchieri||[]).some(function(g){return g.id===gi3})){gi3=base+"-"+k;k++}
      glassWrite(gi3,gd2,"Bicchiere aggiunto.")}
    else if(a==="nuova"){
      var cat=CATNAME[S.tab]?S.tab:"cocktail";
      reset();S.open=null;S.creating=true;S.edit=true;S.formErr="";
      $("main").innerHTML=formRecipe({cat:cat});window.scrollTo(0,0);
    }
  });
  document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="pw")doLogin()});

  readHash();render();
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(x){}}
  if(!window.crypto||!crypto.subtle){S.formErr="Questo browser non è abbastanza recente per aprire il ricettario.";render()}
  else fetchFile().then(function(f){
    S.file=f;
    var sess=null;try{sess=JSON.parse(localStorage.getItem(SESS)||"null")}catch(x){}
    if(!sess||!sess.dk)return;
    var raw=b64d(sess.dk);
    return dkKey(raw).then(function(k){return readData(f,k).then(function(d){S.role=sess.role;S.dk=k;S.dkRaw=raw;S.tok=sess.tok||null;afterAuth(d)})}).catch(function(){sessClear()});
  }).catch(function(){S.formErr="Non riesco a leggere il ricettario. Controlla la connessione e riprova.";render()});
})();
</script>
